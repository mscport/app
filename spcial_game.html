<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>লাইভ গেম শো স্টুডিও | প্রতিযোগী ও পরিচালক</title>

  <!-- Google Fonts: Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Firebase Universal Compat SDK (Works in file:// & mobile browsers) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <style>
    * {
      font-family: 'Hind Siliguri', sans-serif !important;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-deep: #070b14;
      --bg-panel: rgba(15, 23, 42, 0.78);
      --border-glass: rgba(148, 163, 184, 0.18);
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --accent-violet: #8b5cf6;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #132043 0%, #0b1120 45%, #050811 100%);
      color: #f1f5f9;
      overflow-x: clip;
      -webkit-overflow-scrolling: touch;
    }

    /* Zero-Blur Ambient Glow (60fps smooth mobile scrolling) */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .bg-orb-1 { width: 380px; height: 380px; background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, rgba(99,102,241,0) 70%); top: -100px; left: -100px; }
    .bg-orb-2 { width: 360px; height: 360px; background: radial-gradient(circle, rgba(6,182,212,0.16) 0%, rgba(6,182,212,0) 70%); bottom: -110px; right: -90px; }
    .bg-orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(245,158,11,0.10) 0%, rgba(245,158,11,0) 70%); top: 45%; left: 55%; }

    /* Crisp Zero-Jank Panels (No heavy backdrop-filter blur on scroll) */
    .glass {
      background: linear-gradient(145deg, rgba(22, 33, 58, 0.95), rgba(11, 17, 32, 0.97));
      border: 1px solid rgba(148, 163, 184, 0.20);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .glass-soft {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    /* Video Stage Zoom, Rotation & Fullscreen Support */
    .video-stage-box {
      position: relative;
      background: #000000;
      overflow: hidden;
    }
    .video-media-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s ease;
      transform-origin: center center;
    }
    .video-stage-expanded {
      position: fixed !important;
      inset: 0 !important;
      z-index: 9999 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      border-radius: 0 !important;
      border: none !important;
      background: #000000 !important;
      display: flex !important;
      flex-direction: column !important;
    }
    .video-stage-expanded .video-stage-inner {
      flex: 1 1 auto !important;
      aspect-ratio: auto !important;
      height: 100% !important;
      border-radius: 0 !important;
      border: none !important;
    }

    /* Main 2-Tab Segmented Switcher */
    .top-tab-bar {
      background: rgba(9, 14, 28, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .top-tab-btn {
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .top-tab-btn.active-player {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      color: #ffffff;
      box-shadow: 0 6px 22px rgba(6, 182, 212, 0.42);
    }
    .top-tab-btn.active-admin {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #ffffff;
      box-shadow: 0 6px 22px rgba(245, 158, 11, 0.42);
    }

    /* Blur Mechanic for Game 1 & 2 */
    .item-blurred-player {
      filter: blur(11px);
      user-select: none;
      -webkit-user-select: none;
      opacity: 0.55;
      transform: scale(0.985);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .item-clear-player {
      filter: blur(0);
      opacity: 1;
      transform: scale(1);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Portrait Mobile Frame for Game 1 & 2 */
    .portrait-stage {
      max-width: 460px;
      margin: 0 auto;
    }

    /* Landscape Stage for Game 3 */
    .landscape-stage {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Pulsing Hijack Buzzer */
    @keyframes buzzerPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.72); }
      50% { transform: scale(1.035); box-shadow: 0 0 0 18px rgba(244, 63, 94, 0); }
    }
    .buzzer-btn {
      animation: buzzerPulse 1.3s infinite;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .pop-in {
      animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.55); }

    /* Live Dot */
    @keyframes livePing {
      0% { transform: scale(1); opacity: 1; }
      75%, 100% { transform: scale(2.2); opacity: 0; }
    }
    .live-dot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background: inherit;
      animation: livePing 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    /* Toggle Switch */
    .switch-track {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: #334155;
      position: relative;
      transition: background 0.2s;
      cursor: pointer;
      flex-shrink: 0;
    }
    .switch-track.on {
      background: #10b981;
    }
    .switch-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    .switch-track.on .switch-thumb {
      transform: translateX(20px);
    }

    /* Unified Vivid Solid-Gradient Pill/Rounded Buttons (All Sizes & Colors) */
    .btn-vivid {
      color: #ffffff !important;
      font-weight: 700 !important;
      border: 1px solid rgba(255, 255, 255, 0.24) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.30), 0 5px 16px rgba(0, 0, 0, 0.35);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), filter 0.18s ease, box-shadow 0.2s ease;
    }
    .btn-vivid:hover:not(:disabled) {
      filter: brightness(1.09);
      transform: translateY(-1px);
    }
    .btn-vivid:active:not(:disabled) {
      transform: scale(0.96);
    }
    .btn-vivid:disabled {
      opacity: 0.45 !important;
      filter: grayscale(0.25);
      transform: none !important;
      cursor: not-allowed !important;
    }
    .btn-blue {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34), 0 6px 20px rgba(6, 182, 212, 0.42) !important;
    }
    .btn-green {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34), 0 6px 20px rgba(16, 185, 129, 0.42) !important;
    }
    .btn-red {
      background: linear-gradient(135deg, #f43f5e 0%, #dc2626 100%) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34), 0 6px 20px rgba(244, 63, 94, 0.44) !important;
    }
    .btn-amber {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34), 0 6px 20px rgba(245, 158, 11, 0.42) !important;
    }
    .btn-purple {
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34), 0 6px 20px rgba(139, 92, 246, 0.42) !important;
    }
    .btn-teal {
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 6px 18px rgba(20, 184, 166, 0.40) !important;
    }
    .btn-slate {
      background: linear-gradient(135deg, #475569 0%, #334155 100%) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 4px 14px rgba(15, 23, 42, 0.45) !important;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .msc-buffer-ring {
      animation: spinRing 1.35s linear infinite;
    }

    /* Participant Anti-Copy / Anti-Screenshot Protection Mode */
    body.player-protected-mode #viewPlayer {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }
    body.player-protected-mode #viewPlayer input,
    body.player-protected-mode #viewPlayer textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
    }
    @media print {
      body.player-protected-mode {
        display: none !important;
      }
    }
    /* Solid Pure-Black Screen Lock (Volume Up/Down + Power / Screenshot Protection) */
    body.player-blackout-locked {
      background: #000000 !important;
      overflow: hidden !important;
    }
    body.player-blackout-locked header,
    body.player-blackout-locked #viewPlayer,
    body.player-blackout-locked footer {
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #playerPrivacyShield.blackout-active {
      background: #000000 !important;
    }

    /* 1870x1180 Pixel Audience Broadcast Stream Stage */
    .audience-viewport {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #030712;
      border-radius: 1rem;
      border: 1px solid rgba(148, 163, 184, 0.22);
    }
    .audience-viewport.audience-fs {
      position: fixed !important;
      inset: 0 !important;
      z-index: 9998 !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }
    .audience-stage-1870 {
      width: 1870px;
      height: 1180px;
      transform-origin: center center;
      background: radial-gradient(circle at 20% 15%, #172554 0%, #0b1120 48%, #040711 100%);
      color: #f8fafc;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 36px 44px;
    }
  </style>
</head>
<body class="relative min-h-screen text-slate-100 selection:bg-cyan-500/30">
  <!-- Background Ambient Orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <!-- Main App Shell -->
  <div class="relative z-10 max-w-6xl mx-auto px-3 sm:px-5 pt-3 pb-10">

    <!-- STRICTLY TWO-TAB TOP BAR -->
    <header class="sticky top-2 z-40 mb-4">
      <div class="top-tab-bar rounded-2xl p-1.5 flex items-center gap-2">

  <div id="toastContainer" class="fixed bottom-4 right-4 left-4 sm:left-auto z-50 flex flex-col gap-2 pointer-events-none max-w-sm ml-auto"></div>

  <!-- Participant Privacy Shield (Solid Black Screen Lock for Volume/Power/Screenshot) -->
  <div id="playerPrivacyShield" class="fixed inset-0 z-[10000] bg-black hidden flex-col items-center justify-center p-6 text-center select-none">
    <div class="w-16 h-16 rounded-2xl bg-rose-500/20 border border-rose-400/50 text-rose-300 flex items-center justify-center mb-4">
      <i data-lucide="lock" class="w-9 h-9"></i>
    </div>
    <h2 id="privacyShieldTitle" class="text-xl sm:text-2xl font-bold text-white mb-2">স্ক্রীন লক করা হয়েছে</h2>
    <p id="privacyShieldMsg" class="text-sm text-rose-200 max-w-sm">প্রতিযোগী মোডে Volume/Power কী, স্ক্রীনশট, স্ক্রীন রেকর্ডিং ও কপি করা সম্পূর্ণ নিষিদ্ধ।</p>
    <button type="button" id="btnDismissPrivacyShield" class="mt-6 px-6 py-2.5 rounded-xl btn-vivid btn-blue text-sm cursor-pointer flex items-center gap-2">

  </div>

  <script>
  (function () {
    'use strict';

    // =========================================================================
    // 1. AUDIO SYNTHESIZER (WEB AUDIO API — ZERO EXTERNAL AUDIO FILES)
    // =========================================================================
    var SoundFX = {
      ctx: null,
      muted: false,
      init: function () {
        if (!this.ctx) {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          try { this.ctx.resume(); } catch (e) {}
        }
      },
      playTone: function (freq, duration, type, volume, delay) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          var now = this.ctx.currentTime + (delay || 0);
          var osc = this.ctx.createOscillator();
          var gain = this.ctx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(volume || 0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {}
      },
      correct: function () {
        this.playTone(587.33, 0.12, 'triangle', 0.16, 0);
        this.playTone(880.0, 0.28, 'triangle', 0.18, 0.11);
      },
      wrong: function () {
        this.playTone(210, 0.22, 'sawtooth', 0.13, 0);
        this.playTone(155, 0.32, 'sawtooth', 0.13, 0.18);
      },
      reveal: function () {
        this.playTone(520, 0.1, 'sine', 0.1, 0);
        this.playTone(680, 0.14, 'sine', 0.1, 0.07);
      },
      hijack: function () {
        this.playTone(740, 0.1, 'square', 0.12, 0);
        this.playTone(987, 0.1, 'square', 0.12, 0.1);
        this.playTone(1174, 0.22, 'square', 0.14, 0.2);
      },
      tick: function () {
        this.playTone(820, 0.045, 'sine', 0.06, 0);
      }
    };

    // =========================================================================
    // 2. SAFE STORAGE & DEFAULT STATE
    // =========================================================================
    var STORAGE_STATE_KEY = 'bengali_live_gameshow_state_v1';
    var STORAGE_CONN_KEY = 'bengali_live_gameshow_conn_v1';
    var STORAGE_LOCAL_KEY = 'bengali_live_gameshow_local_v1';

    function safeGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeSet(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }

    function createDefaultState() {
      return {
        updatedAt: 0,
        activeGame: 'game1', // 'game1' | 'game2' | 'game3' | 'game4'
        showScoreboard: false,
        gamePaused: false,
        pausedSnapshot: null,
        clubLogoUrl: 'msc_logo.png',
        deviceLocks: {},
        players: [
          { id: 'p1', name: 'সৌরভ দাস', score: 0, avatar: 'সৌ' },
          { id: 'p2', name: 'অনন্যা রায়', score: 0, avatar: 'অ' },
          { id: 'p3', name: 'অরিজিৎ সেন', score: 0, avatar: 'অ' },
          { id: 'p4', name: 'প্রিয়াঙ্কা মণ্ডল', score: 0, avatar: 'প্রি' }
        ],
        game1: {
          title: 'জিনিষের নাম বলা',
          allotMode: 'none', // 'none' | 'player' | 'all'
          allottedPlayerId: 'p1',
          selectedPresetId: 'set_g1_1',
          savedSets: [
            { id: 'set_g1_1', name: 'বাজারের তালিকা (সেট ১)', items: ['আলু ৫ কিলো', 'বেগুন ৫০০ গ্রাম', 'পেঁয়াজ ২ কিলো', 'সরষের তেল ১ লিটার', 'কাঁচালঙ্কা ২৫০ গ্রাম', 'আদা ২০০ গ্রাম'] },
            { id: 'set_g1_2', name: 'মুদিখানার তালিকা (সেট ২)', items: ['গোবিন্দভোগ চাল ২ কিলো', 'মসুর ডাল ১ কিলো', 'চিনি ১ কিলো', 'লবণ ১ প্যাকেট', 'হলুদ গুঁড়ো ২০০ গ্রাম', 'ঘি ২৫০ গ্রাম'] }
          ],
          settings: {
            correctPoints: 10,
            useNegative: true,
            wrongPoints: 5,
            useTimer: true,
            timerSeconds: 60
          },
          timer: {
            running: false,
            remaining: 60,
            endsAt: 0
          },
          sets: {
            p1: [
              { id: 'g1_1', text: 'আলু ৫ কিলো', revealed: false, status: 'pending', appliedPoints: 0 },
              { id: 'g1_2', text: 'বেগুন ৫০০ গ্রাম', revealed: false, status: 'pending', appliedPoints: 0 },
              { id: 'g1_3', text: 'পেঁয়াজ ২ কিলো', revealed: false, status: 'pending', appliedPoints: 0 },

      var defaults = { mainTab: 'player', selectedPlayerId: null, adminLoggedIn: false, adminUser: '', adminSubTab: 'game1', adminEditPlayerId: 'p1', configSelectedGame: 'game1', g3RunPlayerId: 'keep', googlyExpanded: {} };
      var raw = safeGet(STORAGE_LOCAL_KEY);
      if (raw) {
        try {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
            var merged = Object.assign({}, defaults, parsed);
            if (!merged.googlyExpanded || typeof merged.googlyExpanded !== 'object') merged.googlyExpanded = {};
            if (['player', 'audience', 'admin'].indexOf(merged.mainTab) === -1) merged.mainTab = 'player';
            if (['game1', 'game2', 'game3', 'game4', 'players', 'settings'].indexOf(merged.adminSubTab) === -1) merged.adminSubTab = 'game1';
            if (['game1', 'game2', 'game3', 'game4'].indexOf(merged.configSelectedGame) === -1) merged.configSelectedGame = 'game1';
            return merged;
          }
        } catch (e) {}
      }
      return defaults;
    }

    var state = loadInitialState();
    var connConfig = loadConnConfig();
    var localSession = loadLocalSession();

    // Persistent Per-Device ID + Public IP for Strict Single-Device / Single-IP Lock
    var DEVICE_ID_KEY = 'bengali_gameshow_device_id_v1';
    var CLIENT_IP_KEY = 'bengali_gameshow_client_ip_v1';
    var myDeviceId = safeGet(DEVICE_ID_KEY);
    if (!myDeviceId) {
      myDeviceId = 'dev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      safeSet(DEVICE_ID_KEY, myDeviceId);
    }
    var myClientIp = safeGet(CLIENT_IP_KEY) || '';
    var hasInitialFirebaseSync = false;
    var firebaseLocksRef = null;

    function detectClientPublicIp() {
      var endpoints = ['https://api.ipify.org?format=json', 'https://api64.ipify.org?format=json'];
      (function tryNext(idx) {
        if (idx >= endpoints.length) return;
        fetch(endpoints[idx], { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (d && d.ip) {
              myClientIp = String(d.ip).trim();
              safeSet(CLIENT_IP_KEY, myClientIp);
              // Update our active lock with resolved IP if already locked
              if (localSession.selectedPlayerId && state.deviceLocks && state.deviceLocks[localSession.selectedPlayerId]) {
                var lk = state.deviceLocks[localSession.selectedPlayerId];
                if (lk.deviceId === myDeviceId && lk.ip !== myClientIp) {
                  lk.ip = myClientIp;
                  if (firebaseConnected && firebaseRef) {
                    try { firebaseRef.child('deviceLocks/' + localSession.selectedPlayerId + '/ip').set(myClientIp); } catch (e) {}
                  }
                }
              }
            } else {
              tryNext(idx + 1);
            }
          })
          .catch(function () { tryNext(idx + 1); });
      })(0);
    }
    detectClientPublicIp();

    // Screen Wake Lock Manager (keeps mobile screen ON & re-acquires after calls)
    var wakeLockSentinel = null;
    async function requestScreenWakeLock() {
      if (!('wakeLock' in navigator) || !navigator.wakeLock) return;
      try {
        if (wakeLockSentinel && !wakeLockSentinel.released) return;
        wakeLockSentinel = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        requestScreenWakeLock();
        if (connConfig.firebaseConfigText && !firebaseConnected) {
          connectFirebase(true);
        }
      }
    });

    function isPlayerLockedByOther(playerId) {
      var lock = state.deviceLocks && state.deviceLocks[playerId];
      if (!lock || !lock.deviceId) return false;
      // Strict check: only the exact device that claimed this player can enter until they change name or Admin unlocks
      return lock.deviceId !== myDeviceId;
    }

    function getMyLockedPlayerId() {
      if (!state.deviceLocks) return null;
      var ids = Object.keys(state.deviceLocks);
      for (var i = 0; i < ids.length; i++) {
        var lk = state.deviceLocks[ids[i]];
        if (lk && lk.deviceId === myDeviceId) return ids[i];
      }
      return null;
    }

    function syncLocksLocallyOnly() {
      safeSet(STORAGE_STATE_KEY, JSON.stringify(state));
      if (broadcastChan) {
        try { broadcastChan.postMessage({ type: 'STATE_UPDATE', state: state }); } catch (e) {}
      }
    }

    function claimPlayerDeviceLock(playerId, onDone) {
      if (isPlayerLockedByOther(playerId)) {
        if (typeof onDone === 'function') onDone(false);
        return false;
      }
      if (!state.deviceLocks) state.deviceLocks = {};

      // Release any previous player locked by this same device before claiming a new one
      var prevPid = getMyLockedPlayerId();
      if (prevPid && prevPid !== playerId) {
        delete state.deviceLocks[prevPid];
        if (firebaseConnected && firebaseRef) {
          try { firebaseRef.child('deviceLocks/' + prevPid).remove(); } catch (e) {}
        }
      }

      var newLock = {
        deviceId: myDeviceId,
        ip: myClientIp || 'device-locked',
        lockedAt: Date.now()
      };

      // Atomic Firebase Transaction prevents two mobiles from ever claiming the same player!
      if (firebaseConnected && firebaseRef) {
        var lockNode = firebaseRef.child('deviceLocks/' + playerId);
        lockNode.transaction(function (currentData) {
          if (currentData && currentData.deviceId && currentData.deviceId !== myDeviceId) {
            return; // Abort transaction: already locked by another mobile/IP!
          }
          return newLock;
        }, function (error, committed, snapshot) {
          if (error || !committed) {
            var liveLock = snapshot ? snapshot.val() : null;
            if (liveLock && liveLock.deviceId) {
              state.deviceLocks[playerId] = liveLock;
              syncLocksLocallyOnly();
              renderAll();
            }
            if (typeof onDone === 'function') onDone(false);
            return;
          }
          state.deviceLocks[playerId] = newLock;
          syncLocksLocallyOnly();
          requestScreenWakeLock();
          if (typeof onDone === 'function') onDone(true);
        });
        return true;
      }

      // Offline / Local fallback
      state.deviceLocks[playerId] = newLock;
      syncLocksLocallyOnly();
      requestScreenWakeLock();
      if (typeof onDone === 'function') onDone(true);
      return true;
    }

    function releasePlayerDeviceLock(playerId, forceAdmin) {
      if (!state.deviceLocks || !state.deviceLocks[playerId]) return;
      if (!forceAdmin && state.deviceLocks[playerId].deviceId !== myDeviceId) return;
      delete state.deviceLocks[playerId];
      if (firebaseConnected && firebaseRef) {
        try { firebaseRef.child('deviceLocks/' + playerId).remove(); } catch (e) {}
      }
      syncLocksLocallyOnly();
      renderAll();
    }

    function toggleGlobalGamePause() {
      var now = Date.now();
      if (!state.gamePaused) {
        // Freeze running timers cleanly
        var snap = {};
        ['game1', 'game2'].forEach(function (gk) {
          if (state[gk].timer && state[gk].timer.running) {
            state[gk].timer.remaining = Math.max(0, Math.ceil((state[gk].timer.endsAt - now) / 1000));
            state[gk].timer.running = false;
            snap[gk + 'WasRunning'] = true;
          }
        });
        if (state.game3.isPlaying) {
          state.game3.currentTime = getEffectiveVideoTime();
          state.game3.isPlaying = false;
          snap.g3WasPlaying = true;
        }
        if (state.game4.running && state.game4.clueEndsAt > 0) {
          snap.g4RemainingMs = Math.max(1000, state.game4.clueEndsAt - now);
          state.game4.running = false;
          snap.g4WasRunning = true;
        }
        state.pausedSnapshot = snap;
        state.gamePaused = true;
        commitState();
        showToast('খেলা পজ করা হয়েছে — সবার স্ক্রীনে অপেক্ষা বার্তা দেখানো হচ্ছে।', 'warn');
      } else {
        var s = state.pausedSnapshot || {};
        ['game1', 'game2'].forEach(function (gk) {
          if (s[gk + 'WasRunning'] && state[gk].timer.remaining > 0) {
            state[gk].timer.running = true;
            state[gk].timer.endsAt = now + state[gk].timer.remaining * 1000;
          }
        });
        if (s.g3WasPlaying && !state.game3.activePopup) {
          state.game3.isPlaying = true;
          state.game3.playbackUpdatedAt = now;
        }
        if (s.g4WasRunning && !state.game4.finished) {
          state.game4.running = true;
          state.game4.clueEndsAt = now + (s.g4RemainingMs || 15000);
        }
        state.pausedSnapshot = null;
        state.gamePaused = false;
        commitState();
        showToast('খেলা পুনরায় চালু হয়েছে!', 'success');
      }
    }

    // =========================================================================
    // 3. REAL-TIME SYNC ENGINE (FIREBASE COMPAT + BROADCASTCHANNEL + LOCALSTORAGE)

    var firebaseDb = null;
    var firebaseStorage = null;
    var firebaseConnected = false;
    var firebaseRef = null;

    function saveLocalSession() {

    }

    function commitState(skipRender) {
      state.updatedAt = Date.now();
      var serialized = JSON.stringify(state);
      safeSet(STORAGE_STATE_KEY, serialized);
      if (broadcastChan) {
        try { broadcastChan.postMessage({ type: 'STATE_UPDATE', state: state }); } catch (e) {}

    function connectFirebase(silent) {
      window.__lastFbStorageErr = '';
      if (!connConfig.firebaseConfigText || !connConfig.firebaseConfigText.trim()) {
        connConfig.firebaseConfigText = DEFAULT_FIREBASE_CONFIG_TEXT;
      }
      if (typeof window.firebase === 'undefined') {
        window.__lastFbStorageErr = 'Firebase SDK লোড হয়নি (ইন্টারনেট সংযোগ বা ব্রাউজার চেক করুন)';
        if (!silent) showToast('Firebase SDK লোড হয়নি। লোকাল লাইভ মোডে চলছে।', 'warn');
        return false;
      }
      try {
        var cfg;
        try {
          cfg = JSON.parse(connConfig.firebaseConfigText.trim());
        } catch (parseErr) {
          cfg = JSON.parse(DEFAULT_FIREBASE_CONFIG_TEXT);
          connConfig.firebaseConfigText = DEFAULT_FIREBASE_CONFIG_TEXT;
        }
        if (!cfg.apiKey || !cfg.databaseURL) {
          cfg = JSON.parse(DEFAULT_FIREBASE_CONFIG_TEXT);
        }
        var app;
        if (window.firebase.apps && window.firebase.apps.length > 0) {
          app = window.firebase.apps[0];
        } else {
          app = window.firebase.initializeApp(cfg);
        }
        firebaseDb = window.firebase.database(app);
        try {
          if (typeof window.firebase.storage === 'function') {
            firebaseStorage = window.firebase.storage(app);
          } else {
            firebaseStorage = null;
            window.__lastFbStorageErr = 'Firebase Storage লাইব্রেরি লোড হয়নি';
          }
        } catch (e) {
          firebaseStorage = null;
          window.__lastFbStorageErr = e && e.message ? e.message : String(e);
        }
        var roomPath = 'gameshow_rooms/' + (connConfig.roomCode || 'LIVE_ROOM_01').replace(/[^a-zA-Z0-9_-]/g, '_');
        if (firebaseRef) firebaseRef.off();
        if (firebaseLocksRef) firebaseLocksRef.off();
        firebaseRef = firebaseDb.ref(roomPath);
        firebaseLocksRef = firebaseRef.child('deviceLocks');
        firebaseConnected = true;

        // Dedicated Real-Time Device/IP Lock Listener (always authoritative, never blocked by updatedAt)
        firebaseLocksRef.on('value', function (lockSnap) {
          var liveLocks = lockSnap.val() || {};
          state.deviceLocks = liveLocks;
          safeSet(STORAGE_STATE_KEY, JSON.stringify(state));

          // If this phone had a player selected, verify we still own the lock
          if (localSession.mainTab === 'player' && localSession.selectedPlayerId) {
            var curLock = liveLocks[localSession.selectedPlayerId];
            if (curLock && curLock.deviceId && curLock.deviceId !== myDeviceId) {
              localSession.selectedPlayerId = null;
              saveLocalSession();
              showToast('এই নামটি অন্য ডিভাইস/IP-তে লক আছে!', 'error');
            }
          }
          renderAll();
        });

        firebaseRef.on('value', function (snapshot) {
          var val = snapshot.val();
          if (val && val.players && val.game1 && val.game2 && val.game3) {
            if (!hasInitialFirebaseSync || !state.updatedAt || (val.updatedAt && val.updatedAt > state.updatedAt)) {
              hasInitialFirebaseSync = true;
              var prevClueIdx = state.game4 ? state.game4.currentClueIndex : -1;
              var prevG4Running = state.game4 ? state.game4.running : false;
              var prevActiveGame = state.activeGame;
              var prevPaused = state.gamePaused;
              var prevScoreboard = state.showScoreboard;

              suppressNextFirebaseEmit = true;
              state = normalizeFirebaseState(val);
              safeSet(STORAGE_STATE_KEY, JSON.stringify(state));

              // Reset contestant local Googly draft whenever clue index changes or round restarts
              if (state.game4 && (state.game4.currentClueIndex !== prevClueIdx || state.game4.running !== prevG4Running)) {
                localGooglyDraft = '';
              }

              // Avoid interrupting user typing in Googly input or playing Config preview video if only background state changed
              var activeEl = document.activeElement;
              var activeId = activeEl ? activeEl.id : '';
              var isTypingGoogly = (activeId === 'googlyDraftInput') &&
                state.activeGame === prevActiveGame &&
                state.gamePaused === prevPaused &&
                state.showScoreboard === prevScoreboard &&
                state.game4 && state.game4.currentClueIndex === prevClueIdx &&
                state.game4.running === prevG4Running;
              var isEditingCfg = (localSession.mainTab === 'admin' && localSession.adminSubTab === 'settings' && localSession.configSelectedGame === 'game3') &&
                (cfgVideoBuilder.isPlaying || activeId === 'inputCfgQText' || activeId === 'inputCfgQAns' || activeId === 'inputCfgQTime' || activeId === 'inputCfgVideoSetTitle');

              if (!isTypingGoogly && !isEditingCfg) {
                renderAll();
              }
              suppressNextFirebaseEmit = false;
            }
          } else if (localSession.adminLoggedIn) {
            firebaseRef.set(state);
          }
        });

        if (!silent) showToast('Firebase Realtime Database-এর সাথে সফলভাবে সংযুক্ত হয়েছে!', 'success');
        renderAll();
        return true;
      } catch (err) {
        firebaseConnected = false;
        window.__lastFbStorageErr = err && err.message ? err.message : String(err);
        if (!silent) showToast('Firebase সংযোগ ত্রুটি: ' + err.message, 'error');
        return false;
      }
    }

    function normalizeFirebaseState(val) {
      // Firebase drops empty arrays/nulls; ensure required structures exist
      var def = createDefaultState();
      val.players = Array.isArray(val.players) ? val.players : Object.values(val.players || def.players);
      ['game1', 'game2'].forEach(function (gk) {
        if (!val[gk]) val[gk] = def[gk];
        if (!val[gk].sets) val[gk].sets = {};
        val.players.forEach(function (p) {
          if (!val[gk].sets[p.id]) val[gk].sets[p.id] = [];
          else if (!Array.isArray(val[gk].sets[p.id])) val[gk].sets[p.id] = Object.values(val[gk].sets[p.id]);
        });
      });
      if (!val.game3) val.game3 = def.game3;
      if (!val.game3.questions) val.game3.questions = [];
      else if (!Array.isArray(val.game3.questions)) val.game3.questions = Object.values(val.game3.questions);
      if (val.game3.uploadedVideos && !Array.isArray(val.game3.uploadedVideos)) val.game3.uploadedVideos = Object.values(val.game3.uploadedVideos);
      if (val.game3.savedSets && !Array.isArray(val.game3.savedSets)) val.game3.savedSets = Object.values(val.game3.savedSets);
      if (val.game3.activePopup && !Array.isArray(val.game3.activePopup.hijackTriedIds)) {
        val.game3.activePopup.hijackTriedIds = val.game3.activePopup.hijackTriedIds ? Object.values(val.game3.activePopup.hijackTriedIds) : [];
      }
      if (val.game4 && val.game4.playerState) {
        Object.keys(val.game4.playerState).forEach(function (pid) {
          var ps = val.game4.playerState[pid];
          if (ps && ps.answers && !Array.isArray(ps.answers)) ps.answers = Object.values(ps.answers);
          if (ps && !ps.answers) ps.answers = [];
        });
      }
      return ensureStateSchema(val);
    }

    // =========================================================================
    // 4. GOOGLE SHEET LOGIN VERIFICATION
    // =========================================================================
    async function verifyDirectorLogin(username, password) {
      var u = (username || '').trim();
      var p = (password || '').trim();
      if (!u || !p) {
        return { ok: false, msg: 'অনুগ্রহ করে ইউজারনেম এবং পাসওয়ার্ড দিন।' };
      }

      // Direct Google Sheet verification (no demo login)
      var sheetUrl = (connConfig.googleSheetAuthUrl || DEFAULT_APPS_SCRIPT_URL || '').trim();
      if (!sheetUrl || sheetUrl === OLD_APPS_SCRIPT_URL) {
        sheetUrl = DEFAULT_APPS_SCRIPT_URL;
      }
      try {
        var fetchUrl = sheetUrl;
        if (sheetUrl.indexOf('script.google.com') !== -1) {
          var sep = sheetUrl.indexOf('?') === -1 ? '?' : '&';
          fetchUrl = sheetUrl + sep + 'username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p) + '&user=' + encodeURIComponent(u) + '&pass=' + encodeURIComponent(p);
        }
        var resp = await fetch(fetchUrl, { method: 'GET', redirect: 'follow', credentials: 'omit', cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var text = (await resp.text()).trim();

        // Check JSON response (Google Apps Script)
        if (text.startsWith('{') || text.startsWith('[')) {
          var json = JSON.parse(text);
          if (
            json.authorized === true ||
            json.success === true ||
            json.valid === true ||
            json.ok === true ||
            String(json.status || '').toLowerCase() === 'success' ||
            String(json.status || '').toLowerCase() === 'ok' ||
            String(json.result || '').toLowerCase() === 'success'
          ) {
            return { ok: true, source: 'Google Sheet', name: json.name || u };
          }
          if (Array.isArray(json)) {
            var foundArr = json.find(function (row) {
              var ru = String(row.username || row.user || row.id || '').trim();
              var rp = String(row.password || row.pass || row.pin || '').trim();
              return ru.toLowerCase() === u.toLowerCase() && rp === p;
            });
            if (foundArr) return { ok: true, source: 'Google Sheet', name: foundArr.name || u };
          }
          return { ok: false, msg: 'আপনার ভূল হচ্ছে' };
        }

        // Parse Published Google Sheet CSV (columns: username, password, [name])
        var lines = text.split(/\r?\n/).filter(function (l) { return l.trim().length > 0; });
        for (var i = 0; i < lines.length; i++) {
          var cols = parseCsvLine(lines[i]);
          if (cols.length >= 2) {
            var cu = cols[0].trim();
            var cp = cols[1].trim();
            if (cu.toLowerCase() === u.toLowerCase() && cp === p) {
              return { ok: true, source: 'Google Sheet', name: cols[2] ? cols[2].trim() : u };
            }
          }
        }
        return { ok: false, msg: 'আপনার ভূল হচ্ছে' };
      } catch (err) {
        return { ok: false, msg: 'আপনার ভূল হচ্ছে' };
      }
    }

    function parseCsvLine(line) {
      var res = [];
      var cur = '';
      var inQuotes = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line[i];
        if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          res.push(cur);
          cur = '';
        } else {
          cur += ch;
        }
      }
      res.push(cur);
      return res;
    }

    function adjustPlayerScore(playerId, delta) {
      var p = getPlayerById(playerId);
      if (!p) return;
      p.score = Number(p.score || 0) + Number(delta || 0);
    }

    // =========================================================================
    // 6. GAME 1 & GAME 2 ACTIONS
    // =========================================================================
    function getGameObj(gameKey) {
      return state[gameKey];
    }

    function ensurePlayerSet(gameKey, playerId) {
      var g = getGameObj(gameKey);
      if (!g.sets) g.sets = {};
      if (!g.sets[playerId]) g.sets[playerId] = [];
      return g.sets[playerId];
    }

    function allotGame(gameKey, mode, playerId) {
      state.activeGame = gameKey;
      state.showScoreboard = false;
      var g = getGameObj(gameKey);
      g.allotMode = mode;
      if (playerId) g.allottedPlayerId = playerId;
      commitState();
      if (mode === 'all') {
        showToast('সবার স্ক্রীনে তালিকা শেয়ার করা হয়েছে!', 'success');
      } else if (mode === 'player') {
        var p = getPlayerById(g.allottedPlayerId);
        showToast('শুধুমাত্র ' + (p ? p.name : '') + '-এর স্ক্রীনে পাঠানো হয়েছে!', 'success');
      } else {
        showToast('স্ক্রীন থেকে তালিকা সরানো হয়েছে।', 'warn');
      }
    }

    function toggleItemReveal(gameKey, playerId, itemId) {
      var list = ensurePlayerSet(gameKey, playerId);
      var item = list.find(function (it) { return it.id === itemId; });
      if (!item) return;
      item.revealed = !item.revealed;
      if (item.revealed) SoundFX.reveal();
      commitState();
    }

    function markItemStatus(gameKey, playerId, itemId, newStatus) {
      var g = getGameObj(gameKey);
      var list = ensurePlayerSet(gameKey, playerId);
      var item = list.find(function (it) { return it.id === itemId; });
      if (!item) return;

      // Determine target player receiving the score
      var scoringPlayerId = playerId;

      if (newStatus === 'undo') {
        if (item.appliedPoints) {
          adjustPlayerScore(scoringPlayerId, -item.appliedPoints);
        }
        item.appliedPoints = 0;
        item.status = 'pending';
        commitState();
        showToast('আনডু করা হয়েছে।', 'warn');
        return;
      }

      // Revert previous points if already marked
      if (item.appliedPoints) {
        adjustPlayerScore(scoringPlayerId, -item.appliedPoints);
        item.appliedPoints = 0;
      }

      var pts = 0;
      if (newStatus === 'correct') {
        pts = Number(g.settings.correctPoints || 0);
        SoundFX.correct();
        if (window.confetti) {
          try { window.confetti({ particleCount: 30, spread: 55, origin: { y: 0.7 } }); } catch (e) {}
        }
      } else if (newStatus === 'wrong') {
        pts = g.settings.useNegative ? -Math.abs(Number(g.settings.wrongPoints || 0)) : 0;
        SoundFX.wrong();
      }

      item.status = newStatus;
      item.appliedPoints = pts;
      // Requirement: ঠিক বা ভূল মার্ক করলে সেটা আনব্লার হয়ে যাবে
      item.revealed = true;
      adjustPlayerScore(scoringPlayerId, pts);
      commitState();
    }

    function coverAllItems(gameKey, playerId) {
      var list = ensurePlayerSet(gameKey, playerId);
      list.forEach(function (it) {
        it.revealed = false;
      });
      commitState();
      showToast('Cover করা হয়েছে — সব তালিকা আবার ব্লার হয়ে গেছে।', 'info');
    }

    function clearBlurAllItems(gameKey, playerId) {
      var list = ensurePlayerSet(gameKey, playerId);
      list.forEach(function (it) {
        it.revealed = true;
      });
      SoundFX.reveal();
      commitState();
      showToast('Clear Blur — সব তালিকা স্পষ্ট হয়ে গেছে।', 'success');
    }

    function addListItem(gameKey, playerId, text) {
      var clean = (text || '').trim();
      if (!clean) return;
      var list = ensurePlayerSet(gameKey, playerId);
      list.push({
        id: gameKey + '_' + Date.now() + '_' + Math.floor(Math.random() * 999),
        text: clean,
        revealed: false,
        status: 'pending',
        appliedPoints: 0
      });
      commitState();
      showToast('নতুন আইটেম যোগ হয়েছে।', 'success');
    }

    function deleteListItem(gameKey, playerId, itemId) {
      var list = ensurePlayerSet(gameKey, playerId);
      var idx = list.findIndex(function (it) { return it.id === itemId; });
      if (idx !== -1) {
        if (list[idx].appliedPoints) {
          adjustPlayerScore(playerId, -list[idx].appliedPoints);
        }
        list.splice(idx, 1);
        commitState();
      }
    }

    function resetGameTimer(gameKey) {
      var g = getGameObj(gameKey);
      g.timer.running = false;
      g.timer.remaining = Number(g.settings.timerSeconds || 60);
      g.timer.endsAt = 0;
      commitState();
    }

    function toggleGameTimer(gameKey) {
      var g = getGameObj(gameKey);
      if (g.timer.running) {
        var left = Math.max(0, Math.ceil((g.timer.endsAt - Date.now()) / 1000));
        g.timer.running = false;
        g.timer.remaining = left;
        g.timer.endsAt = 0;
      } else {
        var dur = g.timer.remaining > 0 ? g.timer.remaining : Number(g.settings.timerSeconds || 60);
        g.timer.running = true;
        g.timer.remaining = dur;
        g.timer.endsAt = Date.now() + dur * 1000;
      }
      commitState();
    }

    // =========================================================================
    // 7. GAME 3 (LANDSCAPE VIDEO QUIZ + HIJACK BUZZER + 3s AUTO-RESUME)
    // =========================================================================
    function getEffectiveVideoTime() {
      var g3 = state.game3;
      if (!g3.isPlaying || !g3.playbackUpdatedAt) return g3.currentTime || 0;
      var elapsed = (Date.now() - g3.playbackUpdatedAt) / 1000;
      return Math.min(g3.duration || 30, (g3.currentTime || 0) + elapsed);
    }

    function startVideoPlayback() {
      var g3 = state.game3;
      state.activeGame = 'game3';
      state.showScoreboard = false;
      g3.active = true;
      if (g3.activePopup) return;
      if (g3.currentTime >= (g3.duration || 30) - 0.3) {
        g3.currentTime = 0;
        g3.questions.forEach(function (q) { q.asked = false; });
      }
      g3.isPlaying = true;
      g3.playbackUpdatedAt = Date.now();
      commitState();
    }

    function pauseVideoPlayback() {
      var g3 = state.game3;
      g3.currentTime = getEffectiveVideoTime();
      g3.isPlaying = false;
      g3.playbackUpdatedAt = Date.now();
      commitState();
    }

    function seekVideoPlayback(sec) {
      var g3 = state.game3;
      var target = Math.max(0, Math.min(g3.duration || 30, Number(sec || 0)));
      g3.currentTime = target;
      g3.playbackUpdatedAt = Date.now();
      // Reset asked flag for questions after seek point
      g3.questions.forEach(function (q) {
        if (q.time >= target - 0.2) q.asked = false;
      });
      commitState();
    }

    function triggerVideoQuestion(q) {
      var g3 = state.game3;
      q.asked = true;
      g3.currentTime = q.time;
      g3.isPlaying = false;
      g3.playbackUpdatedAt = Date.now();
      var timerEndsAt = g3.settings.useTimer ? Date.now() + Number(g3.settings.timerSeconds || 15) * 1000 : 0;
      g3.activePopup = {
        questionId: q.id,
        question: q.question,
        answer: q.answer,
        targetPlayerId: q.targetPlayerId,
        phase: 'primary',
        hijackerId: null,
        hijackTriedIds: [],
        outcomeText: '',
        timerEndsAt: timerEndsAt,
        resumeAt: 0
      };
      document.querySelectorAll('video[data-g3-video]').forEach(function (v) { try { v.pause(); } catch (e) {} });
      SoundFX.reveal();
      commitState();
    }

    function adminJudgeVideoCorrect() {
      var g3 = state.game3;
      var pop = g3.activePopup;
      if (!pop || pop.phase === 'answer_revealed') return;

      if (pop.phase === 'hijack_claimed' && pop.hijackerId) {
        var hPts = Number(g3.settings.hijackCorrectPoints || 0);
        adjustPlayerScore(pop.hijackerId, hPts);
        var hp = getPlayerById(pop.hijackerId);
        pop.outcomeText = 'হাইজ্যাক সফল! ' + (hp ? hp.name : '') + ' পেয়েছেন +' + toBnNum(hPts) + ' নম্বর';
      } else {
        var cPts = Number(g3.settings.correctPoints || 0);
        adjustPlayerScore(pop.targetPlayerId, cPts);
        var tp = getPlayerById(pop.targetPlayerId);
        pop.outcomeText = 'সঠিক উত্তর! ' + (tp ? tp.name : '') + ' পেয়েছেন +' + toBnNum(cPts) + ' নম্বর';
      }

      pop.phase = 'answer_revealed';
      pop.resumeAt = Date.now() + 3000;
      SoundFX.correct();
      if (window.confetti) {
        try { window.confetti({ particleCount: 45, spread: 70, origin: { y: 0.65 } }); } catch (e) {}
      }
      commitState();
    }

    function adminJudgeVideoWrong() {
      var g3 = state.game3;
      var pop = g3.activePopup;
      if (!pop || pop.phase === 'answer_revealed') return;

      SoundFX.wrong();

      if (pop.phase === 'primary') {
        var minus = g3.settings.useOriginalWrongMinus ? Math.abs(Number(g3.settings.originalWrongMinus || 0)) : 0;
        if (minus > 0) adjustPlayerScore(pop.targetPlayerId, -minus);
        var tp = getPlayerById(pop.targetPlayerId);
        pop.phase = 'hijack_open';
        pop.hijackerId = null;
        pop.hijackTriedIds = [pop.targetPlayerId];
        pop.outcomeText = (tp ? tp.name : '') + ' ভুল বলেছেন' + (minus > 0 ? ' (-' + toBnNum(minus) + ' নম্বর)' : '') + '। এখন অন্যরা "আমি পারবো" চাপুন!';
        pop.timerEndsAt = g3.settings.useTimer ? Date.now() + Number(g3.settings.timerSeconds || 15) * 1000 : 0;
        commitState();
      } else if (pop.phase === 'hijack_claimed' && pop.hijackerId) {
        var hMinus = g3.settings.useHijackWrongMinus ? Math.abs(Number(g3.settings.hijackWrongMinus || 0)) : 0;
        if (hMinus > 0) adjustPlayerScore(pop.hijackerId, -hMinus);
        var hp = getPlayerById(pop.hijackerId);
        if (!Array.isArray(pop.hijackTriedIds)) pop.hijackTriedIds = [];
        if (pop.hijackTriedIds.indexOf(pop.hijackerId) === -1) pop.hijackTriedIds.push(pop.hijackerId);
        pop.hijackerId = null;
        pop.phase = 'hijack_open';
        pop.outcomeText = (hp ? hp.name : '') + ' হাইজ্যাকে ভুল বলেছেন' + (hMinus > 0 ? ' (-' + toBnNum(hMinus) + ' নম্বর)' : '') + '। অন্য কেউ পারলে "আমি পারবো" চাপুন!';
        commitState();
      }
    }

    function adminJudgeVideoNobody() {
      var g3 = state.game3;
      var pop = g3.activePopup;
      if (!pop || pop.phase === 'answer_revealed') return;
      pop.phase = 'answer_revealed';
      pop.outcomeText = 'কেউ সঠিক উত্তর দিতে পারেননি — সঠিক উত্তর দেখে নিন:';
      pop.resumeAt = Date.now() + 3000;
      SoundFX.reveal();
      commitState();
    }

    function playerClickHijack(playerId) {
      var g3 = state.game3;
      var pop = g3.activePopup;
      if (!pop || pop.phase !== 'hijack_open') return;
      if (pop.targetPlayerId === playerId) return;
      if (Array.isArray(pop.hijackTriedIds) && pop.hijackTriedIds.indexOf(playerId) !== -1) return;

      // First click locks the buzzer!
      pop.phase = 'hijack_claimed';
      pop.hijackerId = playerId;
      var hp = getPlayerById(playerId);
      pop.outcomeText = (hp ? hp.name : '') + ' সবার আগে "আমি পারবো" চেপেছেন!';
      SoundFX.hijack();
      commitState();
    }

    function handleFirebaseVideoUpload(file) {
      if (!file) return;
      if (!firebaseStorage) connectFirebase(true);
      var progressWrap = document.getElementById('uploadProgressWrap');
      var progressBar = document.getElementById('uploadProgressBar');
      var progressText = document.getElementById('uploadProgressText');
      if (!firebaseStorage) {
        var reason = window.__lastFbStorageErr || 'Firebase Storage SDK সংযুক্ত হয়নি';
        if (progressWrap) progressWrap.classList.remove('hidden');
        if (progressText) progressText.textContent = 'Firebase Storage ত্রুটি: ' + reason;
        showToast('Firebase Storage সংযুক্ত নয়: ' + reason, 'error');
        return;
      }
      if (progressWrap) progressWrap.classList.remove('hidden');
      if (progressBar) progressBar.style.width = '5%';
      if (progressText) progressText.textContent = 'Firebase Storage-এ আপলোড শুরু হচ্ছে...';

      var storagePath = 'gameshow_videos/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      var task = firebaseStorage.ref(storagePath).put(file, { contentType: file.type || 'video/mp4' });
      task.on('state_changed',
        function (snap) {
          var pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
          if (progressBar) progressBar.style.width = pct + '%';
          if (progressText) progressText.textContent = 'Firebase-এ আপলোড হচ্ছে: ' + toBnNum(pct) + '%';
        },
        function (err) {
          var errCode = (err && err.code) ? ('[' + err.code + '] ') : '';
          var errMsg = errCode + (err && err.message ? err.message : 'Firebase Storage অনুমতি/রুলস যাচাই করুন');
          if (progressText) progressText.textContent = 'Firebase আপলোড ব্যর্থ: ' + errMsg;
          showToast('Firebase আপলোড ব্যর্থ: ' + errMsg, 'error');
        },
        function () {
          task.snapshot.ref.getDownloadURL().then(function (url) {
            state.game3.videoSourceType = 'url';
            state.game3.videoUrl = url;
            state.game3.videoName = file.name + ' (Firebase)';
            state.game3.currentTime = 0;
            state.game3.isPlaying = false;
            state.game3.questions.forEach(function (q) { q.asked = false; });
            registerUploadedVideo(state.game3.videoName, 'url', url, 60);
            showToast('ভিডিও Firebase Storage-এ সফলভাবে আপলোড হয়েছে!', 'success');
            if (progressWrap) progressWrap.classList.add('hidden');
            closeModal();
          }).catch(function (err) {
            showToast('Firebase ডাউনলোড URL পাওয়া যায়নি: ' + (err && err.message ? err.message : ''), 'error');
            if (progressWrap) progressWrap.classList.add('hidden');
          });
        }
      );
    }

    function extractGoogleDriveFileId(url) {
      var u = (url || '').trim();
      if (!u) return '';
      var m1 = u.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (m1) return m1[1];
      var m2 = u.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m2) return m2[1];
      if (/^[a-zA-Z0-9_-]{20,}$/.test(u)) return u;
      return '';
    }

    function setGoogleDriveVideoByLink(linkOrId, customName, customDuration) {
      var fid = extractGoogleDriveFileId(linkOrId);
      if (!fid) {
        showToast('সঠিক Google Drive ভিডিও লিংক বা File ID দিন।', 'error');
        return false;
      }
      state.game3.videoSourceType = 'gdrive';
      state.game3.videoUrl = 'https://drive.google.com/file/d/' + fid + '/preview';
      state.game3.videoName = (customName && customName.trim()) ? customName.trim() : 'Google Drive ভিডিও';
      if (customDuration && Number(customDuration) > 0) {
        state.game3.duration = Number(customDuration);
      } else if (!state.game3.duration || state.game3.duration < 10) {
        state.game3.duration = 120;
      }
      state.game3.currentTime = 0;
      state.game3.isPlaying = false;
      state.game3.activePopup = null;
      state.game3.questions.forEach(function (q) { q.asked = false; });
      registerUploadedVideo(state.game3.videoName, 'gdrive', state.game3.videoUrl, state.game3.duration);
      showToast('Google Drive ভিডিও সেট হয়েছে!', 'success');
      return true;
    }

    function handleGoogleDriveVideoUpload(file) {
      if (!file) return;
      var scriptUrl = (connConfig.googleDriveUploadUrl || '').trim();
      var progressWrap = document.getElementById('uploadProgressWrap');
      var progressBar = document.getElementById('uploadProgressBar');
      var progressText = document.getElementById('uploadProgressText');

      if (!scriptUrl) {
        var localObjUrl = URL.createObjectURL(file);
        state.game3.videoSourceType = 'url';
        state.game3.videoUrl = localObjUrl;
        state.game3.videoName = file.name + ' (লোকাল প্রিভিউ)';
        state.game3.currentTime = 0;
        state.game3.isPlaying = false;
        state.game3.questions.forEach(function (q) { q.asked = false; });
        // A blob: URL exists only in this browser session; never sync it to other devices.
        safeSet(STORAGE_STATE_KEY, JSON.stringify(state));
        renderAll();
        closeModal();
        showToast('Drive Apps Script URL না থাকায় শুধু এই ডিভাইসে লোকাল প্রিভিউ চালু হয়েছে। অন্য ডিভাইসে চালাতে Drive/Firebase URL দিন।', 'warn');
        return;
      }

      if (file.size > 25 * 1024 * 1024) {
        showToast('সরাসরি Drive আপলোডের জন্য ২৫ MB-এর কম ভিডিও দিন, অথবা বড় ভিডিও Drive-এ আপলোড করে লিংক পেস্ট করুন।', 'warn');
        return;
      }

      if (progressWrap) progressWrap.classList.remove('hidden');
      if (progressBar) progressBar.style.width = '25%';
      if (progressText) progressText.textContent = 'Google Drive-এ আপলোডের জন্য প্রস্তুত হচ্ছে...';

      var reader = new FileReader();
      reader.onload = async function () {
        try {
          var base64Data = String(reader.result || '').split(',')[1] || '';
          if (progressBar) progressBar.style.width = '55%';
          if (progressText) progressText.textContent = 'Google Drive-এ আপলোড হচ্ছে...';

          var resp = await fetch(scriptUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              fileName: file.name,
              mimeType: file.type || 'video/mp4',
              data: base64Data
            })
          });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          var json = await resp.json();
          if (progressBar) progressBar.style.width = '100%';

          var fid = json.fileId || extractGoogleDriveFileId(json.previewUrl || json.url || '');
          if (fid) {
            setGoogleDriveVideoByLink(fid, file.name, 120);
            closeModal();
          } else if (json.downloadUrl || json.url) {
            state.game3.videoSourceType = 'url';
            state.game3.videoUrl = json.downloadUrl || json.url;
            state.game3.videoName = file.name + ' (Google Drive)';
            state.game3.currentTime = 0;
            state.game3.isPlaying = false;
            state.game3.questions.forEach(function (q) { q.asked = false; });
            commitState();
            closeModal();
            showToast('ভিডিও Google Drive-এ সফলভাবে আপলোড হয়েছে!', 'success');
          } else {
            throw new Error(json.error || 'অজানা রেসপন্স');
          }
        } catch (err) {
          showToast('Google Drive আপলোড ব্যর্থ: ' + err.message, 'error');
          if (progressWrap) progressWrap.classList.add('hidden');
        }
      };
      reader.onerror = function () {
        showToast('ফাইল পড়া যায়নি।', 'error');
        if (progressWrap) progressWrap.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    // =========================================================================
    // 7A. CONFIG VIDEO LIBRARY & INTERACTIVE QUESTION SET BUILDER
    // =========================================================================
    var cfgVideoBuilder = {
      selectedVideoId: '',
      setTitle: '',
      currentTime: 0,
      duration: 30,
      isPlaying: false,
      questions: []
    };
    var cfgVideoTimerInterval = null;

    function registerUploadedVideo(name, sourceType, url, duration) {
      if (!state.game3.uploadedVideos || !Array.isArray(state.game3.uploadedVideos)) {
        state.game3.uploadedVideos = [];
      }
      var existing = state.game3.uploadedVideos.find(function (v) {
        return v.url && url && v.url === url;
      });
      if (existing) {
        existing.name = name || existing.name;
        if (duration && Number(duration) > 0) existing.duration = Number(duration);
        cfgVideoBuilder.selectedVideoId = existing.id;
        cfgVideoBuilder.duration = existing.duration || 30;
        cfgVideoBuilder.currentTime = 0;
        cfgVideoBuilder.isPlaying = false;
        commitState();
        return existing;
      }
      var entry = {
        id: 'uv_' + Date.now() + '_' + Math.floor(Math.random() * 999),
        name: name || 'আপলোড ভিডিও',
        sourceType: sourceType || 'url',
        url: url || '',
        duration: Number(duration || 60),
        uploadedAt: Date.now()
      };
      state.game3.uploadedVideos.unshift(entry);
      cfgVideoBuilder.selectedVideoId = entry.id;
      cfgVideoBuilder.duration = entry.duration;
      cfgVideoBuilder.currentTime = 0;
      cfgVideoBuilder.isPlaying = false;
      commitState();
      return entry;
    }

    function getSelectedCfgVideo() {
      var list = state.game3.uploadedVideos || [];
      if (cfgVideoBuilder.selectedVideoId) {
        var found = list.find(function (v) { return v.id === cfgVideoBuilder.selectedVideoId; });
        if (found) return found;
      }
      if (list.length > 0) {
        cfgVideoBuilder.selectedVideoId = list[0].id;
        cfgVideoBuilder.duration = Number(list[0].duration || 30);
        return list[0];
      }
      return null;
    }

    function stopCfgVideoTimer() {
      if (cfgVideoTimerInterval) {
        clearInterval(cfgVideoTimerInterval);
        cfgVideoTimerInterval = null;
      }
      cfgVideoBuilder.isPlaying = false;
    }

    function syncCfgPreviewUI() {
      var vid = document.getElementById('cfgPreviewVideo');
      var timeEl = document.getElementById('cfgVideoTimeDisplay');
      var seekEl = document.getElementById('inputCfgVideoSeek');
      var playBtn = document.getElementById('btnCfgPlayPause');
      var cur = vid ? vid.currentTime : (cfgVideoBuilder.currentTime || 0);
      var dur = (vid && vid.duration && !isNaN(vid.duration)) ? Math.floor(vid.duration) : (cfgVideoBuilder.duration || 30);
      cfgVideoBuilder.currentTime = cur;
      cfgVideoBuilder.duration = Math.max(1, dur);
      if (timeEl) timeEl.textContent = formatTimeMMSS(cur) + ' / ' + formatTimeMMSS(dur);
      if (seekEl && document.activeElement !== seekEl) {
        seekEl.max = Math.max(1, dur);
        seekEl.value = Math.floor(cur);
      }
      if (playBtn) {
        var desiredState = cfgVideoBuilder.isPlaying ? 'playing' : 'paused';
        if (playBtn.getAttribute('data-play-state') !== desiredState) {
          playBtn.setAttribute('data-play-state', desiredState);
          playBtn.innerHTML = cfgVideoBuilder.isPlaying
            ? '<i data-lucide="pause" class="w-4 h-4"></i> পজ করুন'
            : '<i data-lucide="play" class="w-4 h-4"></i> প্লে করুন';
          playBtn.className = 'px-4 py-2 rounded-xl btn-vivid text-xs sm:text-sm flex items-center gap-1.5 cursor-pointer ' + (cfgVideoBuilder.isPlaying ? 'btn-amber' : 'btn-green');
          refreshIcons();
        }
      }
      var demoCvs = document.getElementById('cfgDemoCanvas');
      if (demoCvs) {
        var ctx = demoCvs.getContext('2d');
        if (ctx) {
          var w = demoCvs.width, h = demoCvs.height;
          var grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e1b4b');
          ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
          ctx.textAlign = 'center';
          ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 20px Hind Siliguri, sans-serif';
          ctx.fillText(cfgVideoBuilder.setTitle || 'ভিডিও কনফিগ প্রিভিউ', w / 2, h * 0.36);
          ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 38px monospace';
          ctx.fillText(formatTimeMMSS(cur), w / 2, h * 0.58);
          ctx.fillStyle = '#94a3b8'; ctx.font = '14px Hind Siliguri, sans-serif';
          ctx.fillText(cfgVideoBuilder.isPlaying ? 'চলছে — পজ করে প্রশ্ন যোগ করুন' : 'পজ করা আছে — সময়: ' + Math.floor(cur) + ' সেকেন্ড', w / 2, h * 0.74);
          ctx.textAlign = 'left';
        }
      }
    }

    function toggleCfgVideoPlayPause(forcePause) {
      var vid = document.getElementById('cfgPreviewVideo');
      if (vid) {
        if (forcePause || !vid.paused) {
          vid.pause();
          cfgVideoBuilder.isPlaying = false;
          cfgVideoBuilder.currentTime = vid.currentTime || 0;
          var qTimeInp = document.getElementById('inputCfgQTime');
          if (qTimeInp) qTimeInp.value = Math.max(1, Math.floor(cfgVideoBuilder.currentTime));
        } else {
          vid.play().catch(function () {});
          cfgVideoBuilder.isPlaying = true;
        }
        syncCfgPreviewUI();
        return;
      }
      // Fallback timer for Google Drive iframe / Demo canvas
      if (forcePause || cfgVideoBuilder.isPlaying) {
        stopCfgVideoTimer();
        var qTimeInp2 = document.getElementById('inputCfgQTime');
        if (qTimeInp2) qTimeInp2.value = Math.max(1, Math.floor(cfgVideoBuilder.currentTime));
        syncCfgPreviewUI();
      } else {
        cfgVideoBuilder.isPlaying = true;
        if (cfgVideoBuilder.currentTime >= cfgVideoBuilder.duration) cfgVideoBuilder.currentTime = 0;
        if (cfgVideoTimerInterval) clearInterval(cfgVideoTimerInterval);
        cfgVideoTimerInterval = setInterval(function () {
          if (!cfgVideoBuilder.isPlaying) { stopCfgVideoTimer(); return; }
          cfgVideoBuilder.currentTime = Math.min(cfgVideoBuilder.duration, (cfgVideoBuilder.currentTime || 0) + 0.25);
          if (cfgVideoBuilder.currentTime >= cfgVideoBuilder.duration) {
            stopCfgVideoTimer();
          }
          syncCfgPreviewUI();
        }, 250);
        syncCfgPreviewUI();
      }
    }

    async function fetchUploadedVideosLibrary() {
      var addedCount = 0;
      if (!state.game3.uploadedVideos) state.game3.uploadedVideos = [];
      // 1) Fetch from Firebase Storage gameshow_videos/
      if (firebaseConnected && firebaseStorage) {
        try {
          var res = await firebaseStorage.ref('gameshow_videos').listAll();
          for (var i = 0; i < res.items.length; i++) {
            var itemRef = res.items[i];
            var url = await itemRef.getDownloadURL();
            var exists = state.game3.uploadedVideos.some(function (v) { return v.url === url; });
            if (!exists) {
              var cleanName = itemRef.name.replace(/^\d+_/, '');
              state.game3.uploadedVideos.unshift({
                id: 'uv_fb_' + Date.now() + '_' + i,
                name: cleanName + ' (Firebase)',
                sourceType: 'url',
                url: url,
                duration: 60,
                uploadedAt: Date.now()
              });
              addedCount++;
            }
          }
        } catch (e) {}
      }
      // 2) Try fetching from Google Drive Apps Script (if listVideos endpoint supported)
      var scriptUrl = (connConfig.googleDriveUploadUrl || '').trim();
      if (scriptUrl) {
        try {
          var sep = scriptUrl.indexOf('?') === -1 ? '?' : '&';
          var resp = await fetch(scriptUrl + sep + 'action=listVideos', { method: 'GET' });
          if (resp.ok) {
            var txt = await resp.text();
            if (txt.trim().startsWith('{') || txt.trim().startsWith('[')) {
              var data = JSON.parse(txt);
              var arr = Array.isArray(data) ? data : (Array.isArray(data.videos) ? data.videos : []);
              arr.forEach(function (item, idx) {
                var fid = item.fileId || extractGoogleDriveFileId(item.previewUrl || item.url || '');
                var pUrl = fid ? ('https://drive.google.com/file/d/' + fid + '/preview') : (item.url || '');
                if (pUrl && !state.game3.uploadedVideos.some(function (v) { return v.url === pUrl; })) {
                  state.game3.uploadedVideos.unshift({
                    id: 'uv_gd_' + Date.now() + '_' + idx,
                    name: (item.fileName || item.name || 'Drive ভিডিও') + ' (Drive)',
                    sourceType: fid ? 'gdrive' : 'url',
                    url: pUrl,
                    duration: Number(item.duration || 120),
                    uploadedAt: Date.now()
                  });
                  addedCount++;
                }
              });
            }
          }
        } catch (e) {}
      }
      commitState();
      if (addedCount > 0) {
        showToast(toBnNum(addedCount) + ' টি নতুন আপলোড ভিডিও ফেচ হয়েছে!', 'success');
      } else {
        showToast('মোট ' + toBnNum(state.game3.uploadedVideos.length) + ' টি ভিডিও লাইব্রেরিতে প্রস্তুত আছে।', 'info');
      }
    }

    function uploadCfgVideoToFirebase(file) {
      if (!file) return;
      if (!firebaseStorage) {
        connectFirebase(true);
      }
      var pw = document.getElementById('cfgUploadProgressWrap');
      var pb = document.getElementById('cfgUploadProgressBar');
      var pt = document.getElementById('cfgUploadProgressText');
      if (!firebaseStorage) {
        var reason = window.__lastFbStorageErr || 'Firebase Storage সংযুক্ত হয়নি';
        if (pw) pw.classList.remove('hidden');
        if (pb) pb.style.width = '0%';
        if (pt) pt.textContent = 'Firebase Storage ত্রুটি: ' + reason;
        showToast('Firebase Storage সংযুক্ত নয়: ' + reason, 'error');
        return;
      }
      if (pw) pw.classList.remove('hidden');
      if (pb) pb.style.width = '5%';
      if (pt) pt.textContent = 'Firebase Storage-এ আপলোড শুরু হচ্ছে...';
      var storagePath = 'gameshow_videos/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      var task = firebaseStorage.ref(storagePath).put(file, { contentType: file.type || 'video/mp4' });
      task.on('state_changed',
        function (snap) {
          var pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
          if (pb) pb.style.width = pct + '%';
          if (pt) pt.textContent = 'Firebase-এ আপলোড হচ্ছে: ' + toBnNum(pct) + '%';
        },
        function (err) {
          var errCode = (err && err.code) ? ('[' + err.code + '] ') : '';
          var errMsg = errCode + (err && err.message ? err.message : 'Firebase Storage অনুমতি/রুলস যাচাই করুন');
          if (pb) pb.style.width = '0%';
          if (pt) pt.textContent = 'Firebase আপলোড ব্যর্থ: ' + errMsg;
          showToast('Firebase আপলোড ব্যর্থ: ' + errMsg, 'error');
        },
        function () {
          task.snapshot.ref.getDownloadURL().then(function (url) {
            registerUploadedVideo(file.name + ' (Firebase)', 'url', url, 60);
            if (pw) pw.classList.add('hidden');
            showToast('ভিডিও Firebase-এ আপলোড সফল! এখন প্লে/পজ করে প্রশ্ন-উত্তর যোগ করুন।', 'success');
          }).catch(function (err) {
            if (pw) pw.classList.add('hidden');
            showToast('Firebase ডাউনলোড লিংক পাওয়া যায়নি: ' + (err && err.message ? err.message : ''), 'error');
          });
        }
      );
    }

    function uploadCfgVideoToCloudinary(file) {
      if (!file) return;
      var cloudName = (connConfig.cloudinaryCloudName || '').trim();
      var preset = (connConfig.cloudinaryUploadPreset || '').trim();
      if (!cloudName || !preset) {
        openCloudinarySetupModal();
        showToast('প্রথমে ফ্রি Cloudinary Cloud Name ও Unsigned Preset দিন।', 'warn');
        return;
      }
      var pw = document.getElementById('cfgUploadProgressWrap');
      var pb = document.getElementById('cfgUploadProgressBar');
      var pt = document.getElementById('cfgUploadProgressText');
      if (pw) pw.classList.remove('hidden');
      if (pb) pb.style.width = '5%';
      if (pt) pt.textContent = 'Cloudinary-তে আপলোড শুরু হচ্ছে...';

      var formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', preset);

      try {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://api.cloudinary.com/v1_1/' + encodeURIComponent(cloudName) + '/video/upload', true);
      xhr.upload.onprogress = function (ev) {
        if (ev.lengthComputable) {
          var pct = Math.round((ev.loaded / ev.total) * 100);
          if (pb) pb.style.width = pct + '%';
          if (pt) pt.textContent = 'Cloudinary-তে আপলোড হচ্ছে: ' + toBnNum(pct) + '%';
        }
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var json = JSON.parse(xhr.responseText);
            if (json.secure_url) {
              var dur = json.duration ? Math.floor(json.duration) : 60;
              registerUploadedVideo(file.name + ' (Cloudinary)', 'url', json.secure_url, dur);
              if (pw) pw.classList.add('hidden');
              showToast('ভিডিও Cloudinary-তে আপলোড সফল! কোনো কালো ব্লার ছাড়াই চলবে।', 'success');
              return;
            }
          } catch (e) {}
        }
        if (pb) pb.style.width = '0%';
        if (pt) pt.textContent = 'Cloudinary আপলোড ব্যর্থ (HTTP ' + xhr.status + ')। Cloud Name ও Unsigned Preset যাচাই করুন।';
        showToast('Cloudinary আপলোড ব্যর্থ হয়েছে।', 'error');
      };
      xhr.onerror = function () {
        if (pb) pb.style.width = '0%';
        if (pt) pt.textContent = 'Cloudinary নেটওয়ার্ক ত্রুটি। ইন্টারনেট যাচাই করুন।';
        showToast('Cloudinary আপলোড সংযোগ ব্যর্থ।', 'error');
      };
      xhr.send(formData);
      } catch (e) {
        if (pb) pb.style.width = '0%';
        if (pt) pt.textContent = 'Cloudinary আপলোড ত্রুটি: ' + (e && e.message ? e.message : '');
        showToast('Cloudinary আপলোড করা যায়নি।', 'error');
      }
    }

    function uploadCfgVideoToDrive(file) {
      if (!file) return;
      var scriptUrl = (connConfig.googleDriveUploadUrl || '').trim();
      var pw = document.getElementById('cfgUploadProgressWrap');
      var pb = document.getElementById('cfgUploadProgressBar');
      var pt = document.getElementById('cfgUploadProgressText');
      if (!scriptUrl) {
        var localObjUrl = URL.createObjectURL(file);
        registerUploadedVideo(file.name + ' (লোকাল)', 'url', localObjUrl, 60);
        showToast('ভিডিও লোড হয়েছে!', 'warn');
        return;
      }
      if (file.size > 25 * 1024 * 1024) {
        showToast('সরাসরি Drive আপলোডের জন্য ২৫ MB-এর কম ভিডিও দিন অথবা নিচে Drive লিংক পেস্ট করুন।', 'warn');
        return;
      }
      if (pw) pw.classList.remove('hidden');
      if (pb) pb.style.width = '25%';
      if (pt) pt.textContent = 'Google Drive-এ আপলোডের জন্য প্রস্তুত হচ্ছে...';

      var reader = new FileReader();
      reader.onload = async function () {
        try {
          var base64Data = String(reader.result || '').split(',')[1] || '';
          if (pb) pb.style.width = '60%';
          if (pt) pt.textContent = 'Google Drive-এ আপলোড হচ্ছে...';
          var resp = await fetch(scriptUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ fileName: file.name, mimeType: file.type || 'video/mp4', data: base64Data })
          });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          var json = await resp.json();
          if (pb) pb.style.width = '100%';
          var fid = json.fileId || extractGoogleDriveFileId(json.previewUrl || json.url || '');
          if (fid) {
            registerUploadedVideo(file.name + ' (Drive)', 'gdrive', 'https://drive.google.com/file/d/' + fid + '/preview', 120);
            if (pw) pw.classList.add('hidden');
            showToast('ভিডিও Google Drive-এ আপলোড হয়েছে! এখন প্লে/পজ করে প্রশ্ন-উত্তর যোগ করুন।', 'success');
          } else if (json.downloadUrl || json.url) {
            registerUploadedVideo(file.name + ' (Drive)', 'url', json.downloadUrl || json.url, 120);
            if (pw) pw.classList.add('hidden');
            showToast('ভিডিও Google Drive-এ আপলোড হয়েছে!', 'success');
          } else {
            throw new Error(json.error || 'অজানা রেসপন্স');
          }
        } catch (err) {
          showToast('Google Drive আপলোড ব্যর্থ: ' + err.message, 'error');
          if (pw) pw.classList.add('hidden');
        }
      };
      reader.readAsDataURL(file);
    }

    // =========================================================================
    // 7B. PRESET SET RUNNERS (GAME 1, 2, 3) & GAME 4 (GOOGLY) ENGINE
    // =========================================================================
    function runListGamePreset(gameKey, presetId, targetPlayerOrAll) {
      var g = state[gameKey];
      var preset = (g.savedSets || []).find(function (s) { return s.id === presetId; });
      if (!preset) {
        showToast('অনুগ্রহ করে একটি সেট নির্বাচন করুন।', 'error');
        return;
      }
      g.selectedPresetId = preset.id;
      var targetPid = targetPlayerOrAll === 'all' ? (localSession.adminEditPlayerId || state.players[0].id) : targetPlayerOrAll;
      localSession.adminEditPlayerId = targetPid;
      saveLocalSession();

      g.sets[targetPid] = preset.items.map(function (txt, idx) {
        return {
          id: gameKey + '_' + Date.now() + '_' + idx,
          text: txt,
          revealed: false,
          status: 'pending',
          appliedPoints: 0
        };
      });

      state.activeGame = gameKey;
      state.showScoreboard = false;
      g.allottedPlayerId = targetPid;
      g.allotMode = targetPlayerOrAll === 'all' ? 'all' : 'player';
      if (g.settings.useTimer) {
        g.timer.remaining = Number(g.settings.timerSeconds || 60);
        g.timer.running = true;
        g.timer.endsAt = Date.now() + g.timer.remaining * 1000;
      }
      SoundFX.reveal();
      commitState();
      showToast('"' + preset.name + '" রান করা হয়েছে!', 'success');
    }
