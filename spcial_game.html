    // --- GAME 4: GOOGLY ENGINE ---
    var localGooglyDraft = '';
    var typingSyncTimer = null;

    function getActiveGooglySet() {
      var g4 = state.game4;
      return (g4.savedSets || []).find(function (s) { return s.id === g4.selectedSetId; }) || (g4.savedSets && g4.savedSets[0]) || null;
    }

    function normalizeGooglyText(t) {
      return String(t || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function isGooglyAnswerCorrect(typed, gSet) {
      var clean = normalizeGooglyText(typed);
      if (!clean || clean === normalizeGooglyText('নো Answer!')) return false;
      var accepted = [gSet.answer || ''];
      if (gSet.synonyms) {
        gSet.synonyms.split(',').forEach(function (syn) { accepted.push(syn); });
      }
      for (var i = 0; i < accepted.length; i++) {
        var norm = normalizeGooglyText(accepted[i]);
        if (norm && norm === clean) return true;
      }
      return false;
    }

    function ensureGooglyPlayerState(pid) {
      if (!state.game4.playerState) state.game4.playerState = {};
      if (!state.game4.playerState[pid]) {
        state.game4.playerState[pid] = { draft: '', isTyping: false, lastTypedAt: 0, streak: 0, answers: [] };
      }
      if (!Array.isArray(state.game4.playerState[pid].answers)) {
        state.game4.playerState[pid].answers = [];
      }
      return state.game4.playerState[pid];
    }

    function startGooglyGame(setId) {
      var g4 = state.game4;
      if (setId) g4.selectedSetId = setId;
      var gSet = getActiveGooglySet();
      if (!gSet || !gSet.clues || gSet.clues.length === 0) {
        showToast('এই গুগলি সেটে কোনো ক্লু নেই।', 'error');
        return;
      }
      state.activeGame = 'game4';
      state.showScoreboard = false;
      g4.active = true;
      g4.running = true;
      g4.finished = false;
      g4.scoresPublished = false;
      g4.currentClueIndex = 0;
      g4.clueEndsAt = Date.now() + Number(g4.settings.clueIntervalSeconds || 20) * 1000;
      g4.playerState = {};
      state.players.forEach(function (p) {
        g4.playerState[p.id] = { draft: '', isTyping: false, lastTypedAt: 0, streak: 0, answers: [] };
      });
      localGooglyDraft = '';
      SoundFX.reveal();
      commitState();
      showToast('গুগলি খেলা শুরু হয়েছে! প্রথম ক্লু উন্মুক্ত।', 'success');
    }

    function stopGooglyGame() {
      state.game4.running = false;
      state.game4.active = false;
      commitState();
      showToast('গুগলি খেলা বন্ধ করা হয়েছে।', 'warn');
    }

    function lockCurrentGooglyClueAndAdvance() {
      var g4 = state.game4;
      var gSet = getActiveGooglySet();
      if (!gSet || !g4.running || g4.currentClueIndex < 0) return;

      var idx = g4.currentClueIndex;
      var total = gSet.clues.length;
      var clueNum = total - idx;
      var ptsPer = Number(g4.settings.pointsPerClue || 1);

      // Capture local input if this browser is currently a player
      if (localSession.selectedPlayerId) {
        var inp = document.getElementById('googlyDraftInput');
        if (inp) {
          localGooglyDraft = inp.value;
          ensureGooglyPlayerState(localSession.selectedPlayerId).draft = inp.value;
        }
      }

      state.players.forEach(function (p) {
        var ps = ensureGooglyPlayerState(p.id);
        var rawText = (ps.draft || '').trim();
        var finalText = rawText ? rawText : 'নো Answer!';
        var correct = rawText ? isGooglyAnswerCorrect(rawText, gSet) : false;

        // Exact Googly Rule: Correct adds +ptsPer, Wrong or No Answer RESETS accumulated streak to 0!
        if (correct) {
          ps.streak = Number(ps.streak || 0) + ptsPer;
        } else {
          ps.streak = 0;
        }

        ps.answers.push({
          clueNum: clueNum,
          clueIndex: idx,
          text: finalText,
          isCorrect: correct,
          streakAfter: ps.streak
        });
        ps.draft = '';
        ps.isTyping = false;
      });

      localGooglyDraft = '';

      if (idx + 1 < total) {
        g4.currentClueIndex = idx + 1;
        g4.clueEndsAt = Date.now() + Number(g4.settings.clueIntervalSeconds || 20) * 1000;
        SoundFX.reveal();
      } else {
        g4.running = false;
        g4.finished = true;
        g4.clueEndsAt = 0;
        SoundFX.correct();
      }
      commitState();
    }

    function publishGooglyScores() {
      var g4 = state.game4;
      if (g4.scoresPublished) return;
      state.players.forEach(function (p) {
        var ps = ensureGooglyPlayerState(p.id);
        if (ps.streak > 0) {
          adjustPlayerScore(p.id, ps.streak);
        }
      });
      g4.scoresPublished = true;
      g4.running = false;
      g4.finished = true;
      SoundFX.correct();
      if (window.confetti) {
        try { window.confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 } }); } catch (e) {}
      }
      commitState();
      showToast('গুগলি স্কোর সবার মূল স্কোরবোর্ডে যোগ ও প্রকাশ করা হয়েছে!', 'success');
    }

    var idleTypingTimer = null;
    function updatePlayerGooglyDraft(playerId, text, immediateSubmit) {
      var g4 = state.game4;
      if (!g4.running || !playerId) return;
      var ps = ensureGooglyPlayerState(playerId);
      ps.draft = text;
      ps.isTyping = !immediateSubmit && text.trim().length > 0;
      ps.lastTypedAt = Date.now();
      localGooglyDraft = text;

      // Per-player isolated Firebase path update (prevents multi-player overwrite!)
      if (firebaseConnected && firebaseRef) {
        try {
          firebaseRef.child('game4/playerState/' + playerId).update({
            draft: ps.draft,
            isTyping: ps.isTyping,
            lastTypedAt: ps.lastTypedAt
          });
          firebaseRef.child('updatedAt').set(Date.now());
        } catch (e) {}
      } else {
        commitState(true);
      }

      if (idleTypingTimer) clearTimeout(idleTypingTimer);
      if (ps.isTyping) {
        idleTypingTimer = setTimeout(function () {
          if (!state.game4.running) return;
          var curPs = ensureGooglyPlayerState(playerId);
          curPs.isTyping = false;
          if (firebaseConnected && firebaseRef) {
            try { firebaseRef.child('game4/playerState/' + playerId + '/isTyping').set(false); } catch (e) {}
          } else {
            commitState(true);
          }
        }, 2500);
      }

      var statusEl = document.getElementById('googlySaveBadge');
      if (statusEl) {
        statusEl.textContent = immediateSubmit ? 'উত্তর সেভ হয়েছে (সময় শেষ হলে লক হবে)' : 'অটো-সেভ প্রস্তুত...';
      }
    }

    // =========================================================================
    // 8. REAL-TIME TICKER LOOP (TIMERS, VIDEO SYNC, 3s AUTO-RESUME & DEMO CANVAS)
    // =========================================================================
    var lastTickSec = -1;
    function startMasterLoop() {
      setInterval(function () {
        var now = Date.now();

        // Update Game 1 & 2 countdown display
        ['game1', 'game2'].forEach(function (gk) {
          var g = state[gk];
          if (g && g.timer && g.timer.running) {
            var left = Math.max(0, Math.ceil((g.timer.endsAt - now) / 1000));
            var els = document.querySelectorAll('[data-timer-display="' + gk + '"]');
            els.forEach(function (el) { el.textContent = formatTimeMMSS(left); });
            if (left <= 5 && left > 0 && left !== lastTickSec) {
              lastTickSec = left;
              SoundFX.tick();
            }
            if (left <= 0 && localSession.adminLoggedIn) {
              g.timer.running = false;
              g.timer.remaining = 0;
              SoundFX.wrong();
              commitState();
            }
          }
        });

        // Update Game 4 (Googly) Clue Countdown & Auto-Save on Expiry
        var g4 = state.game4;
        if (g4 && g4.running && g4.clueEndsAt > 0) {
          var g4Left = Math.max(0, Math.ceil((g4.clueEndsAt - now) / 1000));
          document.querySelectorAll('[data-g4-timer]').forEach(function (el) {
            el.textContent = formatTimeMMSS(g4Left);
          });
          if (g4Left <= 3 && g4Left > 0 && g4Left !== lastTickSec) {
            lastTickSec = g4Left;
            SoundFX.tick();
          }
          // Contestants flush their typed draft 1 second before lock so nothing is lost
          if (g4Left === 1 && localSession.selectedPlayerId && !localSession.adminLoggedIn) {
            var flushInp = document.getElementById('googlyDraftInput');
            if (flushInp && flushInp.value.trim()) {
              updatePlayerGooglyDraft(localSession.selectedPlayerId, flushInp.value, true);
            }
          }
          if (now >= g4.clueEndsAt && (!firebaseConnected || localSession.adminLoggedIn)) {
            lockCurrentGooglyClueAndAdvance();
            return;
          }
        }

        // Update Game 3 Video Playback, Question Triggers, & 3-Second Auto-Resume
        var g3 = state.game3;
        if (g3) {
          // 1) Question Countdown Timer
          if (g3.activePopup && g3.activePopup.timerEndsAt > 0 && g3.activePopup.phase !== 'answer_revealed') {
            var qLeft = Math.max(0, Math.ceil((g3.activePopup.timerEndsAt - now) / 1000));
            document.querySelectorAll('[data-g3-qtimer]').forEach(function (el) {
              el.textContent = toBnNum(qLeft) + ' সেকেন্ড';
            });
          }

          // 2) 3-Second Auto-Resume after Answer Revealed
          if (g3.activePopup && g3.activePopup.phase === 'answer_revealed' && g3.activePopup.resumeAt > 0) {
            var rLeft = Math.max(0, Math.ceil((g3.activePopup.resumeAt - now) / 1000));
            document.querySelectorAll('[data-g3-resumetimer]').forEach(function (el) {
              el.textContent = toBnNum(rLeft);
            });
            if (now >= g3.activePopup.resumeAt && (!firebaseConnected || localSession.adminLoggedIn)) {
              // Resume automatically (authoritative on Admin)!
              g3.activePopup = null;
              g3.isPlaying = true;
              g3.playbackUpdatedAt = Date.now();
              commitState();
              return;
            }
          }

          // 3) Sync Video Element or Demo Canvas
          var effTime = getEffectiveVideoTime();
          if (g3.isPlaying && !g3.activePopup && (!firebaseConnected || localSession.adminLoggedIn)) {
            // Check if any unasked question timestamp is reached (authoritative on Admin)
            var dueQ = g3.questions.find(function (q) {
              return !q.asked && effTime >= Number(q.time) && effTime < Number(q.time) + 1.8;
            });
            if (dueQ) {
              triggerVideoQuestion(dueQ);
              return;
            }
            if (effTime >= (g3.duration || 30)) {
              g3.currentTime = g3.duration || 30;
              g3.isPlaying = false;
              commitState();
              return;
            }
          }

          // Update progress bars and time labels
          document.querySelectorAll('[data-g3-time]').forEach(function (el) {
            el.textContent = formatTimeMMSS(effTime) + ' / ' + formatTimeMMSS(g3.duration || 30);
          });
          document.querySelectorAll('[data-g3-progress]').forEach(function (el) {
            var pct = Math.min(100, (effTime / (g3.duration || 30)) * 100);
            el.style.width = pct + '%';
          });
          var seekEl = document.getElementById('inputG3Seek');
          if (seekEl && document.activeElement !== seekEl) {
            seekEl.max = Math.max(1, g3.duration || 30);
            seekEl.value = Math.floor(effTime);
          }

          // Smoothly sync real HTML5 <video> elements without stutter/re-buffering
          if (g3.videoSourceType === 'url' && g3.videoUrl) {
            document.querySelectorAll('video[data-g3-video]').forEach(function (vid) {
              if (vid.duration && !isNaN(vid.duration) && Math.abs(g3.duration - vid.duration) > 1) {
                g3.duration = Math.floor(vid.duration);
              }
              var drift = Math.abs(vid.currentTime - effTime);
              if (!vid.seeking && vid.readyState >= 2) {
                if (g3.isPlaying && !g3.activePopup) {
                  if (drift > 2.8) {
                    try { vid.currentTime = effTime; } catch (e) {}
                  }
                } else if (drift > 0.8) {
                  try { vid.currentTime = effTime; } catch (e) {}
                }
              }
              if (g3.isPlaying && !g3.activePopup) {
                if (vid.paused && vid.readyState >= 2) {
                  var playProm = vid.play();
                  if (playProm && typeof playProm.catch === 'function') {
                    playProm.catch(function () {
                      // Mobile autoplay policy fallback: start muted so stream stays 100% synced, show Unmute pill
                      vid.muted = true;
                      vid.play().catch(function () {});
                      var unmuteBtn = document.getElementById('btnUnmutePlayerVideo');
                      if (unmuteBtn) unmuteBtn.classList.remove('hidden');
                    });
                  }
                }
              } else {
                if (!vid.paused) vid.pause();
              }
            });
          } else {
            // Draw Demo Animated Studio Broadcast Canvas
            drawDemoVideoCanvases(effTime);
          }
        }
      }, 150);
    }

    function drawDemoVideoCanvases(effTime) {
      var canvases = document.querySelectorAll('canvas[data-demo-video]');
      if (!canvases.length) return;
      var g3 = state.game3;
      canvases.forEach(function (cvs) {
        var ctx = cvs.getContext('2d');
        if (!ctx) return;
        var w = cvs.width;
        var h = cvs.height;

        // Animated deep broadcast background
        var grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(0.5, '#1e1b4b');
        grad.addColorStop(1, '#0c4a6e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // Moving studio light waves
        ctx.save();
        for (var i = 0; i < 4; i++) {
          var cx = (w * 0.25 * (i + 1) + Math.sin(effTime * 1.4 + i * 1.5) * 80);
          var cy = h * 0.5 + Math.cos(effTime * 1.1 + i) * 55;
          var r = 90 + Math.sin(effTime * 2 + i) * 20;
          var rg = ctx.createRadialGradient(cx, cy, 4, cx, cy, r);
          rg.addColorStop(0, i % 2 === 0 ? 'rgba(6,182,212,0.34)' : 'rgba(245,158,11,0.28)');
          rg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = rg;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Broadcast Header Pill
        ctx.fillStyle = 'rgba(244, 63, 94, 0.9)';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(22, 18, 128, 30, 15) : ctx.fillRect(22, 18, 128, 30);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px Hind Siliguri, sans-serif';
        ctx.fillText('● LIVE QUIZ TV', 36, 38);

        // Center Stage Graphic
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 30px Hind Siliguri, sans-serif';
        ctx.fillText('লাইভ ভিডিও কুইজ রাউন্ড', w / 2, h * 0.40);

        ctx.fillStyle = '#38bdf8';
        ctx.font = '600 18px Hind Siliguri, sans-serif';
        var nextQ = g3.questions.find(function (q) { return !q.asked && q.time > effTime; });
        var subText = g3.isPlaying
          ? (nextQ ? ('পরবর্তী প্রশ্ন আসছে: ' + formatTimeMMSS(nextQ.time) + ' সেকেন্ডে') : 'ভিডিও স্ট্রিমিং চলছে...')
          : 'ভিডিও বিরতিতে আছে (পরিচালক প্লে করলে চলবে)';
        ctx.fillText(subText, w / 2, h * 0.52);

        // Big Digital Timecode
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 42px monospace';
        ctx.fillText(formatTimeMMSS(effTime), w / 2, h * 0.72);

        // Timeline markers on bottom of canvas
        var pad = 40;
        var barW = w - pad * 2;
        var barY = h - 28;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(pad, barY, barW, 6);
        ctx.fillStyle = '#06b6d4';
        ctx.fillRect(pad, barY, barW * Math.min(1, effTime / (g3.duration || 30)), 6);

        // Question marker dots
        g3.questions.forEach(function (q) {
          var qx = pad + barW * Math.min(1, q.time / (g3.duration || 30));
          ctx.fillStyle = q.asked ? '#10b981' : '#f59e0b';
          ctx.beginPath();
          ctx.arc(qx, barY + 3, 6, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.textAlign = 'left';
      });
    }

    // =========================================================================
    // 8B. VIDEO ZOOM, ROTATION & FULLSCREEN CONTROLLER (ALL VIDEO STAGES)
    // =========================================================================
    var videoViewState = {};

    function getVideoStageState(stageId) {
      if (!videoViewState[stageId]) {
        videoViewState[stageId] = { zoom: 1, rotate: 0, expanded: false };
      }
      return videoViewState[stageId];
    }

    function applyVideoStageTransform(stageId) {
      var st = getVideoStageState(stageId);
      var stageEl = document.getElementById(stageId);
      if (stageEl) {
        if (st.expanded) stageEl.classList.add('video-stage-expanded');
        else stageEl.classList.remove('video-stage-expanded');
      }
      var wrap = document.querySelector('[data-vid-wrap="' + stageId + '"]');
      if (wrap) {
        var rotScale = 1;
        if (st.rotate === 90 || st.rotate === 270) {
          var box = wrap.parentElement;
          if (box && box.clientWidth > 0 && box.clientHeight > 0) {
            rotScale = Math.min(box.clientWidth / box.clientHeight, box.clientHeight / box.clientWidth);
            rotScale = Math.max(0.56, Math.min(1, rotScale));
          } else {
            rotScale = 0.62;
          }
        }
        var finalScale = Number((st.zoom * rotScale).toFixed(2));
        wrap.style.transform = 'rotate(' + st.rotate + 'deg) scale(' + finalScale + ')';
      }
      var badge = document.querySelector('[data-vid-status="' + stageId + '"]');
      if (badge) {
        badge.textContent = toBnNum(Math.round(st.zoom * 100)) + '% • ' + toBnNum(st.rotate) + '°';
      }
      var fsBtn = document.querySelector('[data-vid-fullscreen="' + stageId + '"]');
      if (fsBtn) {
        var expFlag = st.expanded ? '1' : '0';
        if (fsBtn.getAttribute('data-fs-state') !== expFlag) {
          fsBtn.setAttribute('data-fs-state', expFlag);
          fsBtn.innerHTML = st.expanded
            ? '<i data-lucide="minimize-2" class="w-3.5 h-3.5"></i> ছোট স্ক্রীন'
            : '<i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> বড় স্ক্রীন';
          refreshIcons();
        }
      }
    }

    function toggleVideoStageFullscreen(stageId) {
      var st = getVideoStageState(stageId);
      var stageEl = document.getElementById(stageId);
      if (!stageEl) return;
      st.expanded = !st.expanded;
      if (st.expanded) {
        if (stageEl.requestFullscreen) {
          stageEl.requestFullscreen().catch(function () {});
        } else if (stageEl.webkitRequestFullscreen) {
          try { stageEl.webkitRequestFullscreen(); } catch (e) {}
        }
        try {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function () {});
          }
        } catch (e) {}
      } else {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
          try { document.webkitExitFullscreen(); } catch (e) {}
        }
        try {
          if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        } catch (e) {}
      }
      applyVideoStageTransform(stageId);
    }

    document.addEventListener('fullscreenchange', function () {
      if (!document.fullscreenElement) {
        Object.keys(videoViewState).forEach(function (sid) {
          if (videoViewState[sid].expanded) {
            videoViewState[sid].expanded = false;
            applyVideoStageTransform(sid);
          }
        });
      }
    });

    // Participant Fullscreen + Anti-Copy / Anti-Screenshot / Anti-Recording Guards
    var privacyShieldTimer = null;
    function isParticipantProtectedActive() {
      return localSession.mainTab === 'player' && !!localSession.selectedPlayerId;
    }

    function updateParticipantProtectionBodyClass() {
      if (isParticipantProtectedActive()) {

    function showPrivacyShield(autoHideMs, customMsg) {
      if (!isParticipantProtectedActive()) return;
      var sh = document.getElementById('playerPrivacyShield');
      if (!sh) return;
      document.body.classList.add('player-blackout-locked');
      sh.classList.add('blackout-active');
      sh.classList.remove('hidden');
      sh.classList.add('flex');
      var msgEl = document.getElementById('privacyShieldMsg');
      if (msgEl) {
        msgEl.textContent = customMsg || 'প্রতিযোগী মোডে Volume/Power কী, স্ক্রীনশট, স্ক্রীন রেকর্ডিং ও কপি করা সম্পূর্ণ নিষিদ্ধ।';
      }
      refreshIcons();
      if (privacyShieldTimer) clearTimeout(privacyShieldTimer);
      if (autoHideMs && autoHideMs > 0) {
        privacyShieldTimer = setTimeout(hidePrivacyShield, autoHideMs);
      }
    }

    function hidePrivacyShield() {
      var sh = document.getElementById('playerPrivacyShield');
      document.body.classList.remove('player-blackout-locked');
      if (!sh) return;
      sh.classList.remove('blackout-active');
      sh.classList.add('hidden');
      sh.classList.remove('flex');

    function togglePlayerPageFullscreen() {
      var root = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (root.requestFullscreen) root.requestFullscreen().catch(function () {});
        else if (root.webkitRequestFullscreen) { try { root.webkitRequestFullscreen(); } catch (e) {} }
      } else {

      }

    // Global Anti-Copy / Anti-ContextMenu / Anti-Screenshot Listeners (strictly for Participant mode)
    ['copy', 'cut', 'contextmenu', 'dragstart'].forEach(function (evtName) {
      document.addEventListener(evtName, function (e) {
        if (!isParticipantProtectedActive()) return;
        var tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
        if (evtName === 'contextmenu' || (tag !== 'INPUT' && tag !== 'TEXTAREA')) {
          e.preventDefault();
          showToast('প্রতিযোগী মোডে কপি বা স্ক্রীনশট নিষিদ্ধ!', 'warn');
        }
      });
    });

    function isHardwareVolumeOrPowerKey(e) {
      var k = String(e.key || '').toLowerCase();
      var code = String(e.code || '').toLowerCase();
      var kc = e.keyCode || e.which || 0;
      return (
        k === 'audiovolumeup' || k === 'audiovolumedown' || k === 'audiovolumemute' ||
        k === 'volumeup' || k === 'volumedown' || k === 'power' || k === 'poweroff' ||
        k === 'sleep' || k === 'standby' || k === 'snapshot' || k === 'printscreen' ||
        code === 'audiovolumeup' || code === 'audiovolumedown' || code === 'power' || code === 'printscreen' ||
        kc === 24 || kc === 25 || kc === 26 || kc === 44 || kc === 174 || kc === 175 || kc === 182 || kc === 183
      );
    }

    function handleParticipantKeyGuard(e) {
      if (!isParticipantProtectedActive()) return;
      var k = String(e.key || '').toLowerCase();
      var isHwKey = isHardwareVolumeOrPowerKey(e);
      var blocked =
        isHwKey ||
        (e.ctrlKey && (k === 'c' || k === 'x' || k === 's' || k === 'p' || k === 'u')) ||
        (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c' || k === 's')) ||
        (e.metaKey && e.shiftKey && (k === '3' || k === '4' || k === '5')) ||
        k === 'f12';
      if (blocked) {
        e.preventDefault();
        e.stopPropagation();
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(''); } catch (err) {}
        // Solid pure-black screen lock (stays locked until manually unlocked!)
        showPrivacyShield(
          0,
          isHwKey
            ? 'Volume Up/Down বা Power কী চাপা হয়েছে — নিরাপত্তার জন্য স্ক্রীন কালো করে লক করা হলো।'
            : 'প্রতিযোগী মোডে স্ক্রীনশট, স্ক্রীন রেকর্ডিং ও কপি করা সম্পূর্ণ নিষিদ্ধ।'
        );
      }
    }

    document.addEventListener('keydown', handleParticipantKeyGuard, true);
    document.addEventListener('keyup', function (e) {
      if (!isParticipantProtectedActive()) return;
      if (isHardwareVolumeOrPowerKey(e)) {
        e.preventDefault();
        showPrivacyShield(0, 'Volume Up/Down বা Power কী চাপা হয়েছে — নিরাপত্তার জন্য স্ক্রীন কালো করে লক করা হলো।');

        selectedPid = state.players[0].id;
        localSession.adminEditPlayerId = selectedPid;

      var items = ensurePlayerSet(gameKey, selectedPid);
      var selPlayer = getPlayerById(selectedPid);
      var isThisAllottedPlayer = state.activeGame === gameKey && g.allotMode === 'player' && g.allottedPlayerId === selectedPid;
      var isThisAllottedAll = state.activeGame === gameKey && g.allotMode === 'all' && g.allottedPlayerId === selectedPid;

      // Player Set Selector Pills (shows live score cleanly)
      var playerPills = state.players.map(function (p) {

            '<span>' + escapeHtml(p.name) + '</span>' +
            '<span class="px-1.5 py-0.5 rounded-md text-[11px] bg-black/25 text-white">' + toBnNum(p.score) + '</span>' +

    function renderAll() {

      tabP.className = baseTabCls + (localSession.mainTab === 'player' ? 'btn-blue' : 'btn-slate');
      if (tabAud) tabAud.className = baseTabCls + (localSession.mainTab === 'audience' ? 'btn-purple' : 'btn-slate');
      tabA.className = baseTabCls + (localSession.mainTab === 'admin' ? 'btn-amber' : 'btn-slate');

      bindDynamicEvents();
      drawDemoVideoCanvases(getEffectiveVideoTime());

    function bindDynamicEvents() {
      // Player Tab Events (with Atomic Firebase Single-Device / Single-IP Lock + Screen Wake Lock)
      document.querySelectorAll('[data-select-player]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          SoundFX.init();
          var pid = btn.getAttribute('data-select-player');
          if (isPlayerLockedByOther(pid)) {
            showToast('এই প্রতিযোগী ইতিমধ্যেই অন্য মোবাইল/IP-তে লক আছেন! নাম পরিবর্তন না করা পর্যন্ত ঢোকা যাবে না।', 'error');
            return;
          }
          btn.disabled = true;
          claimPlayerDeviceLock(pid, function (ok) {
            if (!ok) {
              btn.disabled = false;
              showToast('এই প্রতিযোগী ইতিমধ্যেই অন্য মোবাইল/IP-তে লক আছেন!', 'error');
              renderAll();
              return;
            }
            localSession.selectedPlayerId = pid;
            saveLocalSession();
            // Auto-request fullscreen when participant enters competition
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen().catch(function () {});
            }
            renderAll();
          });
        });
      });

      var btnSwitchP = document.getElementById('btnSwitchPlayer');
      if (btnSwitchP) {
        btnSwitchP.addEventListener('click', function () {
          if (localSession.selectedPlayerId) {
            releasePlayerDeviceLock(localSession.selectedPlayerId, false);
          }
          localSession.selectedPlayerId = null;
          saveLocalSession();
          renderAll();
        });
      }

      var btnMuteP = document.getElementById('btnMutePlayer');
      if (btnMuteP) {
        btnMuteP.addEventListener('click', function () {
          SoundFX.muted = !SoundFX.muted;
          renderAll();
        });
      }

      var btnHijack = document.getElementById('btnPlayerHijack');
      if (btnHijack) {
        btnHijack.addEventListener('click', function () {
          if (localSession.selectedPlayerId) {
            playerClickHijack(localSession.selectedPlayerId);

      // Admin Login Form

      if (loginForm) {
        loginForm.addEventListener('submit', async function (e) {
          e.preventDefault();
          SoundFX.init();
          var u = document.getElementById('loginUsername').value;
          var p = document.getElementById('loginPassword').value;

          btn.disabled = true;
          btn.textContent = 'যাচাই করা হচ্ছে...';
          var res = await verifyDirectorLogin(u, p);
          if (res.ok) {
            localSession.adminLoggedIn = true;
            localSession.adminUser = res.name + ' (' + res.source + ')';
            saveLocalSession();
            showToast('পরিচালক লগিন সফল হয়েছে!', 'success');

          var fd = new FormData(formCreateG4);
          var name = String(fd.get('g4Name') || '').trim();
          var ans = String(fd.get('g4Ans') || '').trim();
          var syns = String(fd.get('g4Syns') || '').trim();
          var clues = String(fd.get('g4Clues') || '').split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
          if (!name || !ans || clues.length === 0) return;
          state.game4.savedSets.push({ id: 'googly_' + Date.now(), name: name, answer: ans, synonyms: syns || ans, clues: clues });
          commitState();
          showToast('নতুন গুগলি সেট সেভ হয়েছে!', 'success');
        });
      }

      document.querySelectorAll('[data-del-g4set]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var sid = btn.getAttribute('data-del-g4set');
          if (state.game4.savedSets.length <= 1) { showToast('কমপক্ষে একটি গুগলি সেট থাকতে হবে।', 'warn'); return; }
          state.game4.savedSets = state.game4.savedSets.filter(function (s) { return s.id !== sid; });
          commitState();
        });
      });

      var btnPlayPause = document.getElementById('btnG3PlayPause');
      if (btnPlayPause) {
        btnPlayPause.addEventListener('click', function () {
          SoundFX.init();
          if (state.game3.isPlaying) pauseVideoPlayback();
          else startVideoPlayback();
        });
      }

      var btnRestart = document.getElementById('btnG3Restart');
      if (btnRestart) {
        btnRestart.addEventListener('click', function () {
          state.game3.activePopup = null;
          seekVideoPlayback(0);
        });
      }

      var btnG3C = document.getElementById('btnG3Correct');
      if (btnG3C) btnG3C.addEventListener('click', adminJudgeVideoCorrect);

      var btnG3W = document.getElementById('btnG3Wrong');
      if (btnG3W) btnG3W.addEventListener('click', adminJudgeVideoWrong);

      var btnG3N = document.getElementById('btnG3Nobody');
      if (btnG3N) btnG3N.addEventListener('click', adminJudgeVideoNobody);

      // Add question handled cleanly via openAddQuestionModal()

      document.querySelectorAll('[data-g3-trigger-q]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var qid = btn.getAttribute('data-g3-trigger-q');
          var q = state.game3.questions.find(function (x) { return x.id === qid; });
          if (q) {
            state.activeGame = 'game3';
            state.game3.active = true;
            state.showScoreboard = false;
            triggerVideoQuestion(q);
          }
        });
      });

      document.querySelectorAll('[data-g3-del-q]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var qid = btn.getAttribute('data-g3-del-q');
          state.game3.questions = state.game3.questions.filter(function (x) { return x.id !== qid; });
          commitState();
        });
      });

      // Players Management
      var formAddP = document.getElementById('formAddPlayer');
      if (formAddP) {
        formAddP.addEventListener('submit', function (e) {
          e.preventDefault();
          var inp = formAddP.querySelector('input[name="playerName"]');
          var name = inp ? inp.value.trim() : '';
          if (!name) return;
          var pid = 'p_' + Date.now();
          state.players.push({ id: pid, name: name, score: 0, avatar: name.slice(0, 1) });
          ensurePlayerSet('game1', pid);
          ensurePlayerSet('game2', pid);
          ensureGooglyPlayerState(pid);
          commitState();
          showToast('নতুন প্রতিযোগী যোগ হয়েছে!', 'success');
        });
      }

      var btnResetAll = document.getElementById('btnResetAllScores');
      if (btnResetAll) {
        btnResetAll.addEventListener('click', function () {
          state.players.forEach(function (p) { p.score = 0; });
          commitState();
          showToast('সবার স্কোর ০ করা হয়েছে।', 'warn');
        });
      }

      document.querySelectorAll('[data-score-delta]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var parts = btn.getAttribute('data-score-delta').split('|');
          adjustPlayerScore(parts[0], Number(parts[1]));
          commitState();
        });
      });

      document.querySelectorAll('[data-score-reset]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var p = getPlayerById(btn.getAttribute('data-score-reset'));
          if (p) { p.score = 0; commitState(); }
        });
      });

      document.querySelectorAll('[data-edit-player]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          openEditPlayerModal(btn.getAttribute('data-edit-player'));
        });
      });

      var btnPlayerFs = document.getElementById('btnPlayerFullScreen');
      if (btnPlayerFs) {
        btnPlayerFs.addEventListener('click', togglePlayerPageFullscreen);
      }

      var btnAudFs = document.getElementById('btnAudienceFullscreen');
      if (btnAudFs) {
        btnAudFs.addEventListener('click', toggleAudienceFullscreen);
      }

      var btnAudExitFs = document.getElementById('btnAudienceExitFsInside');
      if (btnAudExitFs) {
        btnAudExitFs.addEventListener('click', toggleAudienceFullscreen);
      }

      document.querySelectorAll('[data-del-player]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var pid = btn.getAttribute('data-del-player');
          if (state.players.length <= 1) {
            showToast('কমপক্ষে একজন প্রতিযোগী থাকতে হবে।', 'error');
            return;
          }
          state.players = state.players.filter(function (p) { return p.id !== pid; });
          if (localSession.selectedPlayerId === pid) localSession.selectedPlayerId = null;
          commitState();
        });
      });

      // Settings Toggles & Inputs
      document.querySelectorAll('[data-toggle-setting]').forEach(function (el) {
        el.addEventListener('click', function () {
          var path = el.getAttribute('data-toggle-setting').split('.');
          var gk = path[0];
          var key = path[1];
          state[gk].settings[key] = !state[gk].settings[key];
          commitState();
        });
      });

      document.querySelectorAll('[data-num-setting]').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var path = inp.getAttribute('data-num-setting').split('.');
          var gk = path[0];
          var key = path[1];
          state[gk].settings[key] = Math.max(0, Number(inp.value || 0));
          if (key === 'timerSeconds' && state[gk].timer && !state[gk].timer.running) {
            state[gk].timer.remaining = state[gk].settings[key];
          }
          commitState();
          showToast('সেটিংস আপডেট হয়েছে।', 'success');
        });
      });
    }

    // Top 2-Tab Navigation Listeners
    document.getElementById('mainTabPlayer').addEventListener('click', function () {
      localSession.mainTab = 'player';
      saveLocalSession();
      renderAll();
    });

    var tabAudBtn = document.getElementById('mainTabAudience');
    if (tabAudBtn) {
      tabAudBtn.addEventListener('click', function () {
        stopCfgVideoTimer();
        localSession.mainTab = 'audience';
        saveLocalSession();
        renderAll();
      });
    }

    document.getElementById('mainTabAdmin').addEventListener('click', function () {
      localSession.mainTab = 'admin';
      saveLocalSession();
      renderAll();
    });

    var btnDismissShield = document.getElementById('btnDismissPrivacyShield');
    if (btnDismissShield) {
      btnDismissShield.addEventListener('click', hidePrivacyShield);
    }

    // Auto-request Wake Lock on first touch/click
    window.addEventListener('pointerdown', function () { requestScreenWakeLock(); }, { passive: true });

    // Boot Application
    window.addEventListener('load', function () {
      if (connConfig.firebaseConfigText) {
        connectFirebase(true);
      }
      renderAll();
      startMasterLoop();
    });
  })();
  </script>
</body>
</html>
