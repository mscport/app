<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>স্পেশাল প্রতিযোগী - মডার্ণ স্পোর্টিং ক্লাব</title>
    <meta name="theme-color" content="#064e3b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #022c22 0%, #064e3b 48%, #0f172a 100%);
            color: #ffffff;
            overflow: hidden;
            position: relative;
            padding: 24px 18px;
        }

        /* Blurred Ambient Background Layer */
        .bg-blur-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .blur-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.45;
            animation: floatOrb 8s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 280px;
            height: 280px;
            background: #f59e0b;
            top: -70px;
            left: -60px;
        }
        .orb-2 {
            width: 320px;
            height: 320px;
            background: #10b981;
            bottom: -90px;
            right: -70px;
            animation-delay: 1.5s;
        }
        .orb-3 {
            width: 220px;
            height: 220px;
            background: #3b82f6;
            top: 45%;
            left: 55%;
            animation-delay: 3s;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(22px, -24px) scale(1.1); }
        }

        /* Frosted Glass Backdrop Card */
        .coming-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.46);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 36px 24px 30px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        .top-pill {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 999px;
            background: rgba(251, 191, 36, 0.16);
            border: 1px solid rgba(251, 191, 36, 0.45);
            color: #fde68a;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            margin-bottom: 24px;
        }

        /* Buffer Ring around Club Logo */
        .logo-buffer-wrap {
            position: relative;
            width: 128px;
            height: 128px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .buffer-ring-outer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4.5px solid rgba(255, 255, 255, 0.14);
            border-top-color: #fbbf24;
            border-right-color: #34d399;
            animation: spinRing 1.05s linear infinite;
            box-shadow: 0 0 24px rgba(251, 191, 36, 0.25);
        }
        .buffer-ring-inner {
            position: absolute;
            inset: 9px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-bottom-color: #38bdf8;
            border-left-color: #f43f5e;
            animation: spinRingReverse 1.6s linear infinite;
        }
        .club-logo-circle {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            overflow: hidden;
            background: #ffffff;
            padding: 3px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .club-logo-circle img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }
        @keyframes spinRingReverse {
            to { transform: rotate(-360deg); }
        }

        .status-main {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        }
        .status-sub {
            font-size: 17px;
            font-weight: 600;
            color: #fde68a;
            margin-top: 8px;
            letter-spacing: 0.6px;
            animation: softPulse 1.8s ease-in-out infinite;
        }
        @keyframes softPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 28px;
            width: 100%;
            max-width: 220px;
            padding: 13px 24px;
            border-radius: 16px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #0f172a;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(245, 158, 11, 0.32);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }
        .back-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
        }

        .credit-footer {
            position: relative;
            z-index: 2;
            margin-top: 22px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.68);
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="bg-blur-layer" aria-hidden="true">
        <div class="blur-orb orb-1"></div>
        <div class="blur-orb orb-2"></div>
        <div class="blur-orb orb-3"></div>
    </div>

    <main class="coming-card">
        <div class="top-pill">🌟 স্পেশাল প্রতিযোগী • MSC</div>

        <div class="logo-buffer-wrap">
            <div class="buffer-ring-outer"></div>
            <div class="buffer-ring-inner"></div>
            <div class="club-logo-circle">
                <img src="msc_logo.png" alt="MSC Logo">
            </div>
        </div>

        <h1 class="status-main">নির্মানাধীন পর্যায়ে আছে</h1>
        <p class="status-sub">খুব শীঘ্র আসছে............</p>

        <a href="index.html" class="back-btn" onclick="goBackHome(event)">
            <span>←</span>
            <span>ফিরে যান</span>
        </a>
    </main>

    <footer class="credit-footer">
        Designed,Develope and Hosted by Modern Sporting Club
    </footer>

    <script>
        function goBackHome(e) {
            if (e) e.preventDefault();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
